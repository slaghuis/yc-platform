version: '3'

vars:
  LOCAL_PREFIX: 'github.com/slaghuis/yc-platform'
  # Deployable services: every services/<name> with a cmd/<name> package.
  SERVICES:
    sh: for d in services/*/cmd/*/; do s="${d#services/}"; echo "${s%%/*}"; done
  REDOCLY: docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/spec" -w /spec redocly/cli:2.1.0

tasks:
  default:
    desc: Show help
    cmds:
      - task --list

  # ─── Bootstrap & deps ─────────────────────────────────────
  bootstrap:
    desc: One-time setup after fresh clone
    cmds:
      - ./scripts/bootstrap.sh

  check-deps:
    desc: Verify required tools are installed
    cmds:
      - ./scripts/check-deps.sh

  tidy:
    desc: go mod tidy for every module in go.work
    cmds:
      - ./scripts/for-each-module.sh go mod tidy

  # ─── Code generation ──────────────────────────────────────
  gen:
    desc: Regenerate all generated code
    deps: [gen:events, gen:openapi]

  gen:events:
    desc: Regenerate Go types from JSON schemas
    sources:
      - 'schemas/yc-event-schemas/**/*.json'
    generates:
      - 'libs/yc-events/types_gen.go'
      - 'libs/yc-events/schemas/**/*.json'
    cmds:
      - go run ./tools/yc-schema-gen

  gen:openapi:
    desc: Regenerate OpenAPI handlers/clients for all services
    cmds:
      - for: { var: SERVICES }
        cmd: |
          if [ -f services/{{.ITEM}}/api/openapi.yaml ]; then
            (cd services/{{.ITEM}} && task gen:openapi)
          fi

  # ─── API documentation ────────────────────────────────────
  docs:api:
    desc: Build HTML API docs from every service's OpenAPI spec into dist/api/
    deps: [docs:api:lint]
    cmds:
      - mkdir -p dist/api
      - |
        {
          echo '<!doctype html><meta charset="utf-8"><title>yc-platform APIs</title><h1>yc-platform APIs</h1>'
          echo '<p>Public and admin paths are served through yc-gateway; internal paths only on its internal listener (ADR-021).</p><ul>'
          for spec in services/*/api/openapi.yaml; do
            s=${spec#services/}; s=${s%%/*}
            {{.REDOCLY}} build-docs "$spec" -o "dist/api/$s.html" >&2
            echo "<li><a href=\"$s.html\">$s</a></li>"
          done
          echo '</ul>'
        } > dist/api/index.html

  docs:api:lint:
    desc: Check every OpenAPI spec is valid (redocly.yaml)
    cmds:
      - '{{.REDOCLY}} lint services/*/api/openapi.yaml'

  # ─── Linting and formatting ───────────────────────────────
  lint:
    desc: Run golangci-lint in every module in go.work
    cmds:
      - ./scripts/for-each-module.sh golangci-lint run

  fmt:
    desc: Format all Go code
    cmds:
      - gofumpt -w .
      - goimports -w -local {{.LOCAL_PREFIX}} .

  schema:validate:
    desc: Validate JSON schemas
    cmds:
      - ./schemas/yc-event-schemas/scripts/validate_all.sh

  schema:compat:
    desc: Check backward compatibility of schemas (against main)
    cmds:
      - ./schemas/yc-event-schemas/scripts/check_backward_compat.sh origin/main

  # ─── Testing ──────────────────────────────────────────────
  test:
    desc: Run unit tests in every module in go.work
    cmds:
      - ./scripts/for-each-module.sh go test ./...

  test:integration:
    desc: Run integration tests in every module (needs Docker; testcontainers starts Postgres and NATS)
    cmds:
      - ./scripts/for-each-module.sh go test -tags=integration ./...

  test:e2e:
    desc: Run end-to-end tests
    cmds:
      - cd test/e2e && go test -tags=e2e -v ./...

  # ─── Build ────────────────────────────────────────────────
  build:
    desc: Build all services
    cmds:
      - for: { var: SERVICES }
        task: build:service
        vars: { SERVICE: '{{.ITEM}}' }

  build:service:
    desc: Build a single service (SERVICE=yc-identity)
    cmds:
      - task -d services/{{.SERVICE}} build

  # ─── Docker ───────────────────────────────────────────────
  docker:build:
    desc: Build Docker images for all services
    cmds:
      - for: { var: SERVICES }
        task: docker:build:service
        vars: { SERVICE: '{{.ITEM}}' }

  docker:build:service:
    desc: Build Docker image for one service (SERVICE=yc-identity)
    cmds:
      - docker build -t yc-platform/{{.SERVICE}}:dev
          -f deploy/docker/Dockerfile.service
          --build-arg SERVICE={{.SERVICE}}
          --build-arg VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo dev) .

  # ─── Dev stack ────────────────────────────────────────────
  devstack:up:
    desc: Start local Postgres, NATS, S3 (SeaweedFS), Jaeger, MailHog
    cmds:
      - docker compose up -d
      - ./scripts/wait-for-stack.sh

  devstack:app:
    desc: Build and start the application services on the dev stack
    cmds:
      - ./scripts/gen-dev-jwt-keys.sh
      - docker compose --profile app up -d --build
      - ./scripts/wait-for-stack.sh --app

  devstack:seed:
    desc: Seed the dev stack for frontend work (system admin, yc-demo shop and shop admin, bucket CORS)
    cmds:
      - ./scripts/seed-dev.sh

  devstack:edge:
    desc: Start the dev edge for the frontends (Caddy on YC_EDGE_PORT, default 8070)
    cmds:
      - docker compose --profile frontends up -d edge

  demo:phase1:
    desc: Run the Phase 1 milestone demo against the running stack (see scripts/demo-phase1.sh)
    cmds:
      - ./scripts/demo-phase1.sh

  demo:phase2:
    desc: Run the Phase 2 milestone demo against the running stack (see scripts/demo-phase2.sh)
    cmds:
      - ./scripts/demo-phase2.sh

  demo:phase3:
    desc: Run the Phase 3 milestone demo against the running stack (see scripts/demo-phase3.sh)
    cmds:
      - ./scripts/demo-phase3.sh

  demo:phase4:
    desc: Run the Phase 4 checkout demo against the running stack (see scripts/demo-phase4.sh)
    cmds:
      - ./scripts/demo-phase4.sh

  demo:phase5:
    desc: Run the Phase 5 Yoco and gateway-routing demo against the running stack (see scripts/demo-phase5.sh)
    cmds:
      - ./scripts/demo-phase5.sh

  demo:phase6:
    desc: Run the Phase 6 fulfilment demo (zones, shipping, packaging, delivery, returns) against the running stack (see scripts/demo-phase6.sh)
    cmds:
      - ./scripts/demo-phase6.sh

  demo:phase7:
    desc: Run the Phase 7 messaging, reviews and abandoned-cart demo against the running stack (see scripts/demo-phase7.sh)
    cmds:
      - ./scripts/demo-phase7.sh

  demo:phase8:
    desc: Run the Phase 8 operations demo (monitor, alerts, DLQ replay, analytics, chargeback, GDPR) against the running stack (see scripts/demo-phase8.sh)
    cmds:
      - ./scripts/demo-phase8.sh

  load:
    desc: "Run the Phase 9 load test against the running stack (browse 500 RPS, 10 concurrent checkouts, 1000 events/s; pass scenarios with -- browse checkout events; see docs/reports/load-test.md)"
    cmds:
      - ./scripts/load-test.sh {{.CLI_ARGS}}

  devstack:down:
    desc: Stop local dev stack
    cmds:
      - docker compose --profile app down

  devstack:reset:
    desc: Wipe and restart dev stack (destroys all data)
    cmds:
      - docker compose --profile app down -v
      - docker compose up -d
      - ./scripts/wait-for-stack.sh

  devstack:logs:
    desc: Follow dev stack logs
    cmds:
      - docker compose logs -f

  # ─── Migrations ───────────────────────────────────────────
  migrate:up:
    desc: Apply all migrations for all services
    cmds:
      - go run ./tools/yc-migrate up --all

  migrate:up:service:
    desc: Apply migrations for one service (SERVICE=yc-identity)
    cmds:
      - go run ./tools/yc-migrate up --service={{.SERVICE}}

  migrate:down:service:
    desc: Roll back one migration (SERVICE=yc-identity)
    cmds:
      - go run ./tools/yc-migrate down --service={{.SERVICE}}

  migrate:new:
    desc: Create a new migration (SERVICE=... NAME=...)
    cmds:
      - go run ./tools/yc-migrate new --service={{.SERVICE}} --name={{.NAME}}

  # ─── Scaffolding ──────────────────────────────────────────
  scaffold:service:
    desc: Create a new service and add it to go.work (NAME=yc-foo; NO_DB=1 for a service without a database)
    requires:
      vars: [NAME]
    cmds:
      - ./scripts/gen-service.sh {{if .NO_DB}}--no-db{{end}} {{.NAME}}

  scaffold:event:
    desc: Create a new event schema (DOMAIN=order ACTION=placed VERSION=1; add ENTITY=stock for non-root entities)
    cmds:
      - ./scripts/gen-event.sh {{.DOMAIN}} {{.ENTITY}} {{.ACTION}} {{.VERSION}}

  # ─── Convenience ──────────────────────────────────────────
  run:
    desc: Build and run a service locally (SERVICE=yc-identity)
    requires:
      vars: [SERVICE]
    cmds:
      - task -d services/{{.SERVICE}} run

  clean:
    desc: Clean all build artifacts and caches
    cmds:
      - go clean -cache -testcache
      - find . -type d -name 'bin' -exec rm -rf {} +

  verify:
    desc: Run full local verification (fmt check, lint, test)
    cmds:
      - task: fmt
      - task: lint
      - task: schema:validate
      - task: test
