services:
  postgres:
    image: postgres:16-alpine
    container_name: yc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/compose/postgres-init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.10-alpine
    container_name: yc-nats
    restart: unless-stopped
    command:
      - "-js"
      - "-sd"
      - "/data"
      - "-m"
      - "8222"
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage. Credentials and the anonymous read grant
  # on yc-images live in deploy/compose/seaweedfs-s3.json.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    container_name: yc-seaweedfs
    restart: unless-stopped
    command:
      - "mini"
      - "-dir=/data"
      - "-bucket=yc-images"
      - "-s3.config=/etc/seaweedfs/s3.json"
      - "-master.telemetry=false"
    ports:
      - "9000:8333"        # S3 API
      - "9001:23646"       # Admin UI
    volumes:
      - s3data:/data
      - ./deploy/compose/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  jaeger:
    image: jaegertracing/all-in-one:1.54
    container_name: yc-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"      # UI
      - "4317:4317"        # OTLP gRPC
      - "4318:4318"        # OTLP HTTP

  mailhog:
    image: mailhog/mailhog:latest
    container_name: yc-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"        # SMTP
      - "8025:8025"        # UI

volumes:
  pgdata:
  natsdata:
  s3data:
