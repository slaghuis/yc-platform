services:
  postgres:
    image: postgres:16-alpine
    container_name: yc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/compose/postgres-init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.10-alpine
    container_name: yc-nats
    restart: unless-stopped
    command:
      - "-js"
      - "-sd"
      - "/data"
      - "-m"
      - "8222"
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage. Credentials and the anonymous read grant
  # on yc-images live in deploy/compose/seaweedfs-s3.json.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    container_name: yc-seaweedfs
    restart: unless-stopped
    command:
      - "mini"
      - "-dir=/data"
      - "-bucket=yc-images"
      - "-s3.config=/etc/seaweedfs/s3.json"
      - "-master.telemetry=false"
    ports:
      - "9000:8333"        # S3 API
      - "9001:23646"       # Admin UI
    volumes:
      - s3data:/data
      - ./deploy/compose/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  jaeger:
    image: jaegertracing/all-in-one:1.54
    container_name: yc-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"      # UI
      - "4317:4317"        # OTLP gRPC
      - "4318:4318"        # OTLP HTTP

  mailhog:
    image: mailhog/mailhog:latest
    container_name: yc-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"        # SMTP
      - "8025:8025"        # UI

  # ─── Application services (profile "app") ─────────────────
  # `task devstack:app` builds and starts them; `task devstack:up` does not.
  # Host ports match the local `task run` ports in .env.example. Product,
  # pricing, image, preference, cart, inventory, payment, orders and checkout
  # register their routes with the
  # gateway's internal listener (:8091, not published to the host), which
  # also carries service-to-service calls (ADR-021).
  yc-identity:
    profiles: [app]
    build: &service-build
      context: .
      dockerfile: deploy/docker/Dockerfile.service
      args: { SERVICE: yc-identity }
    image: yc-platform/yc-identity:dev
    container_name: yc-identity
    restart: unless-stopped
    environment:
      YC_IDENTITY_DB_URL: postgres://yc_identity_app:devpass@postgres:5432/yc_identity?sslmode=disable
      YC_IDENTITY_JWT_PRIVATE_KEY_FILE: /keys/jwt-private.pem
      YC_IDENTITY__NATS__DISABLE_RELAY: ${YC_IDENTITY__NATS__DISABLE_RELAY:-false}
      # Service client secrets (ADR-021); each service presents its own.
      YC_CART_SERVICE_SECRET: ${YC_CART_SERVICE_SECRET:-dev-cart-service-secret-32-chars!!}
      YC_ORDERS_SERVICE_SECRET: ${YC_ORDERS_SERVICE_SECRET:-dev-orders-service-secret-32-chars!}
      YC_CHECKOUT_SERVICE_SECRET: ${YC_CHECKOUT_SERVICE_SECRET:-dev-checkout-service-secret-32chars}
      # Dev only: fake Google/Facebook sign-in and reset links in the log.
      YC_IDENTITY_OAUTH_FAKE: ${YC_IDENTITY_OAUTH_FAKE:-true}
      YC_IDENTITY_LOG_RESET_LINKS: ${YC_IDENTITY_LOG_RESET_LINKS:-true}
      NATS_URL: nats://nats:4222
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_METRICS_EXPORTER: none
    volumes:
      - ./deploy/compose/dev-keys:/keys:ro
    ports:
      - "8081:8080"
    depends_on: &infra
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }

  yc-gateway:
    profiles: [app]
    build:
      <<: *service-build
      args: { SERVICE: yc-gateway }
    image: yc-platform/yc-gateway:dev
    container_name: yc-gateway
    restart: unless-stopped
    environment:
      YC_GATEWAY_DB_URL: postgres://yc_gateway_app:devpass@postgres:5432/yc_gateway?sslmode=disable
      YC_GATEWAY__UPSTREAMS__IDENTITY: http://yc-identity:8080
      YC_GATEWAY_COOKIE_SECURE: "false"
      # admin.localhost resolves to _platform: system admins only.
      YC_GATEWAY__PLATFORM_HOSTS: admin.localhost
      YC_GATEWAY_RATE_LIMIT: ${YC_GATEWAY_RATE_LIMIT:-true}
      NATS_URL: nats://nats:4222
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_METRICS_EXPORTER: none
    ports:
      - "8090:8080"
    depends_on: *infra

  yc-monitor:
    profiles: [app]
    build:
      <<: *service-build
      args: { SERVICE: yc-monitor }
    image: yc-platform/yc-monitor:dev
    container_name: yc-monitor
    restart: unless-stopped
    environment:
      YC_MONITOR_DB_URL: postgres://yc_monitor_app:devpass@postgres:5432/yc_monitor?sslmode=disable
      NATS_URL: nats://nats:4222
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_METRICS_EXPORTER: none
    ports:
      - "8082:8080"
    depends_on: *infra

  yc-product:
    profiles: [app]
    build:
      <<: *service-build
      args: { SERVICE: yc-product }
    image: yc-platform/yc-product:dev
    container_name: yc-product
    restart: unless-stopped
    environment:
      YC_PRODUCT_DB_URL: postgres://yc_product_app:devpass@postgres:5432/yc_product?sslmode=disable
      YC_GATEWAY_INTERNAL_URL: http://yc-gateway:8091
      NATS_URL: nats://nats:4222
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_METRICS_EXPORTER: none
    ports:
      - "8083:8080"
    depends_on: *infra

  yc-pricing:
    profiles: [app]
    build:
      <<: *service-build
      args: { SERVICE: yc-pricing }
    image: yc-platform/yc-pricing:dev
    container_name: yc-pricing
    restart: unless-stopped
    environment:
      YC_PRICING_DB_URL: postgres://yc_pricing_app:devpass@postgres:5432/yc_pricing?sslmode=disable
      YC_GATEWAY_INTERNAL_URL: http://yc-gateway:8091
      # Exchange rates come from api.frankfurter.dev (needs internet access).
      YC_PRICING_RATES_PROVIDER: ${YC_PRICING_RATES_PROVIDER:-frankfurter}
      YC_PRICING_EXCHANGERATE_HOST_KEY: ${YC_PRICING_EXCHANGERATE_HOST_KEY:-}
      NATS_URL: nats://nats:4222
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_METRICS_EXPORTER: none
    ports:
      - "8084:8080"
    depends_on: *infra

  yc-image:
    profiles: [app]
    build:
      <<: *service-build
      args: { SERVICE: yc-image }
    image: yc-platform/yc-image:dev
    container_name: yc-image
    restart: unless-stopped
    environment:
      YC_IMAGE_DB_URL: postgres://yc_image_app:devpass@postgres:5432/yc_image?sslmode=disable
      YC_GATEWAY_INTERNAL_URL: http://yc-gateway:8091
      # The service talks to SeaweedFS inside the network; browsers use the
      # published port for presigned uploads and image URLs.
      S3_ENDPOINT: http://seaweedfs:8333
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_PUBLIC_BASE_URL: http://localhost:9000/yc-images
      S3_ACCESS_KEY_ID: devkey
      S3_SECRET_ACCESS_KEY: devsecret
      NATS_URL: nats://nats:4222
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_METRICS_EXPORTER: none
    ports:
      - "8085:8080"
    depends_on:
      <<: *infra
      seaweedfs: { condition: service_healthy }

  yc-preference:
    profiles: [app]
    build:
      <<: *service-build
      args: { SERVICE: yc-preference }
    image: yc-platform/yc-preference:dev
    container_name: yc-preference
    restart: unless-stopped
    environment:
      YC_PREFERENCE_DB_URL: postgres://yc_preference_app:devpass@postgres:5432/yc_preference?sslmode=disable
      YC_GATEWAY_INTERNAL_URL: http://yc-gateway:8091
      NATS_URL: nats://nats:4222
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_METRICS_EXPORTER: none
    ports:
      - "8086:8080"
    depends_on: *infra

  # Prices carts through the gateway's internal listener (ADR-021) with the
  # client secret yc-identity knows it by.
  yc-cart:
    profiles: [app]
    build:
      <<: *service-build
      args: { SERVICE: yc-cart }
    image: yc-platform/yc-cart:dev
    container_name: yc-cart
    restart: unless-stopped
    environment:
      YC_CART_DB_URL: postgres://yc_cart_app:devpass@postgres:5432/yc_cart?sslmode=disable
      YC_GATEWAY_INTERNAL_URL: http://yc-gateway:8091
      YC_CART_SERVICE_SECRET: ${YC_CART_SERVICE_SECRET:-dev-cart-service-secret-32-chars!!}
      NATS_URL: nats://nats:4222
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_METRICS_EXPORTER: none
    ports:
      - "8087:8080"
    depends_on: *infra

  yc-inventory:
    profiles: [app]
    build:
      <<: *service-build
      args: { SERVICE: yc-inventory }
    image: yc-platform/yc-inventory:dev
    container_name: yc-inventory
    restart: unless-stopped
    environment:
      YC_INVENTORY_DB_URL: postgres://yc_inventory_app:devpass@postgres:5432/yc_inventory?sslmode=disable
      YC_GATEWAY_INTERNAL_URL: http://yc-gateway:8091
      NATS_URL: nats://nats:4222
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_METRICS_EXPORTER: none
    ports:
      - "8088:8080"
    depends_on: *infra

  # Each shop's Stripe and Yoco keys are stored encrypted under the cipher
  # key; the webhooks (/webhooks/stripe, /webhooks/yoco) are gateway
  # callback routes on the shop's host. Without accounts, run the fakes on
  # the host (go run ./services/yc-payment/cmd/fake-stripe, cmd/fake-yoco)
  # and set YC_PAYMENT_STRIPE_API_BASE=http://host.docker.internal:12111 and
  # YC_PAYMENT_YOCO_API_BASE=http://host.docker.internal:12112.
  yc-payment:
    profiles: [app]
    build:
      <<: *service-build
      args: { SERVICE: yc-payment }
    image: yc-platform/yc-payment:dev
    container_name: yc-payment
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      YC_PAYMENT_DB_URL: postgres://yc_payment_app:devpass@postgres:5432/yc_payment?sslmode=disable
      YC_GATEWAY_INTERNAL_URL: http://yc-gateway:8091
      YC_PAYMENT_CIPHER_KEY: ${YC_PAYMENT_CIPHER_KEY:-ZGV2LTMyLWJ5dGUta2V5LXJlcGxhY2UtaW4tcHJvZCE=}
      YC_PAYMENT_STRIPE_API_BASE: ${YC_PAYMENT_STRIPE_API_BASE:-https://api.stripe.com}
      YC_PAYMENT_YOCO_API_BASE: ${YC_PAYMENT_YOCO_API_BASE:-https://payments.yoco.com}
      NATS_URL: nats://nats:4222
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_METRICS_EXPORTER: none
    ports:
      - "8089:8080"
    depends_on: *infra

  # Zones, rates and quotes; books shipments for yc-orders with the manual
  # carrier driver, whose statuses the shop admin sets (ADR-022).
  yc-shipping:
    profiles: [app]
    build:
      <<: *service-build
      args: { SERVICE: yc-shipping }
    image: yc-platform/yc-shipping:dev
    container_name: yc-shipping
    restart: unless-stopped
    environment:
      YC_SHIPPING_DB_URL: postgres://yc_shipping_app:devpass@postgres:5432/yc_shipping?sslmode=disable
      YC_GATEWAY_INTERNAL_URL: http://yc-gateway:8091
      NATS_URL: nats://nats:4222
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_METRICS_EXPORTER: none
    ports:
      - "8094:8080"
    depends_on: *infra

  # Refunds cancelled and returned orders through yc-payment and books
  # shipments with yc-shipping when packaged (ADR-021, ADR-022).
  yc-orders:
    profiles: [app]
    build:
      <<: *service-build
      args: { SERVICE: yc-orders }
    image: yc-platform/yc-orders:dev
    container_name: yc-orders
    restart: unless-stopped
    environment:
      YC_ORDERS_DB_URL: postgres://yc_orders_app:devpass@postgres:5432/yc_orders?sslmode=disable
      YC_GATEWAY_INTERNAL_URL: http://yc-gateway:8091
      YC_ORDERS_SERVICE_SECRET: ${YC_ORDERS_SERVICE_SECRET:-dev-orders-service-secret-32-chars!}
      NATS_URL: nats://nats:4222
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_METRICS_EXPORTER: none
    ports:
      - "8092:8080"
    depends_on: *infra

  # Drives the checkout saga with internal calls to cart, product, pricing,
  # shipping, inventory, payment and orders (ADR-019). YC_CHECKOUT_PAUSE_BEFORE and
  # YC_CHECKOUT_PAUSE_FOR stall the saga for the resumption demo. Saga
  # leases are named after the host, so a fixed hostname lets a restarted
  # container take back its sessions at once rather than after lease_ttl.
  yc-checkout:
    profiles: [app]
    build:
      <<: *service-build
      args: { SERVICE: yc-checkout }
    image: yc-platform/yc-checkout:dev
    container_name: yc-checkout
    hostname: yc-checkout
    restart: unless-stopped
    environment:
      YC_CHECKOUT_DB_URL: postgres://yc_checkout_app:devpass@postgres:5432/yc_checkout?sslmode=disable
      YC_GATEWAY_INTERNAL_URL: http://yc-gateway:8091
      YC_CHECKOUT_SERVICE_SECRET: ${YC_CHECKOUT_SERVICE_SECRET:-dev-checkout-service-secret-32chars}
      YC_CHECKOUT_PAUSE_BEFORE: ${YC_CHECKOUT_PAUSE_BEFORE:-}
      YC_CHECKOUT_PAUSE_FOR: ${YC_CHECKOUT_PAUSE_FOR:-0s}
      NATS_URL: nats://nats:4222
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_METRICS_EXPORTER: none
    ports:
      - "8093:8080"
    depends_on: *infra

volumes:
  pgdata:
  natsdata:
  s3data:
