service: yc-platform

lint:
  enabled: true

test:
  race: true
  coverage: true
  coverage_min: 0

scan:
  govulncheck: true
  trivy: true

build:
  image: yc-platform
  registry: ${REGISTRY}

integration:
  enabled: false

# Deploy: ADR-031 demo is SSH + Docker Compose (`deploy/demo/deploy.sh`).
# No pipeline-lib target yet; do not point at missing deploy/k8s manifests.

notify:
  on_failure: true
  on_success: true
