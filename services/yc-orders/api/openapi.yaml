openapi: 3.1.0
info:
  title: yc-orders
  version: 0.1.0
  description: |
    Orders (docs/services/yc-orders.md): the pending order yc-checkout
    creates, confirms or abandons (ADR-019), the customer's and shop
    admin's views, admin cancellation with a refund through yc-payment,
    and fulfilment (ADR-022): packaging books the shipment in yc-shipping,
    whose events move the order to shipped, delivered or
    delivery_exception. Customers return delivered items within 30 days;
    an accepted return is refunded at once.

    Routes are reached through yc-gateway, which sets X-YC-Tenant-ID,
    X-YC-Actor-ID, X-YC-Actor-Type and X-YC-Correlation-ID
    (api-conventions.md §9). /internal routes are for service callers
    (ADR-021) and require Idempotency-Key on POST; a repeated key replays
    the first response (api-conventions.md §10). An order is a snapshot:
    names, prices and taxes as checkout priced them. Orders that are
    pending_payment or abandoned are hidden from customers and from admin
    listings. The order number (e.g. DEMO-SHOP-000042) is given when the
    order is confirmed. Errors are application/problem+json
    (error-handling.md).

paths:
  /orders/mine:
    get:
      summary: List my orders, newest first
      description: Customers only; a visitor sees a guest order by ID.
      operationId: listMyOrders
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of orders.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderList' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

  /orders/{id}:
    parameters:
      - $ref: '#/components/parameters/OrderID'
    get:
      summary: Get one of my orders
      description: |
        The customer who placed it, or the visitor with the same visitor
        token for a guest order (ADR-010). A signed `guest_token` from the
        order email also opens that guest order on another device (issue #22);
        the token is read-only and does not authorise returns or other mutations.
      operationId: getMyOrder
      parameters:
        - name: guest_token
          in: query
          required: false
          description: |
            Time-limited HMAC token from a guest order email. Required when
            the caller is not the visitor who placed the order.
          schema: { type: string, minLength: 1, maxLength: 512 }
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /orders/{id}/invoice:
    parameters:
      - $ref: '#/components/parameters/OrderID'
    get:
      summary: Download the order invoice PDF
      description: |
        Customer/visitor owner, valid guest_token, or shop admin. Title is
        "Tax Invoice" when seller_invoice.vat_number is set, else "Invoice".
        Amounts come from the order snapshot only (issue #29).
      operationId: getOrderInvoice
      parameters:
        - name: guest_token
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 512 }
      responses:
        '200':
          description: The invoice PDF.
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /orders/{id}/returns:
    parameters:
      - $ref: '#/components/parameters/OrderID'
    post:
      summary: Ask to return delivered items
      description: |
        Within 30 days of delivery, for physical lines, at most what is
        left of each. One request awaits the shop's decision at a time
        (409). Nothing is shipped back through the platform.
      operationId: requestReturn
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReturnInput' }
      responses:
        '201':
          description: The return request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Return' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /admin/orders:
    get:
      summary: List the shop's orders, newest first
      operationId: listOrders
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          description: Without it, placed orders (received and cancelled).
          schema: { $ref: '#/components/schemas/OrderStatus' }
      responses:
        '200':
          description: A page of orders.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderList' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

  /admin/orders/{id}:
    parameters:
      - $ref: '#/components/parameters/OrderID'
    get:
      summary: Get an order with its status history
      operationId: getOrder
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /admin/orders/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/OrderID'
    post:
      summary: Cancel a placed order and refund its payment
      description: |
        A received or packaged order. Refunds what is left of the payment
        through yc-payment, then cancels; yc-shipping cancels a booked
        shipment on order.cancelled.v1. Stock is not returned
        automatically; receive it back in yc-inventory. Cancelling again
        returns the order; a refund the gateway refuses is 409 and leaves
        the order as it was.
      operationId: cancelOrder
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonInput' }
      responses:
        '200':
          description: The cancelled order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /admin/orders/{id}/package:
    parameters:
      - $ref: '#/components/parameters/OrderID'
    post:
      summary: Mark a received order packaged and book its shipment
      description: |
        Books the shipment with yc-shipping (the chosen method and rate,
        to the delivery address); the carrier driver gives the tracking
        number. Packaging again returns the order. A digital order, or one
        that is not received, is 409.
      operationId: packageOrder
      responses:
        '200':
          description: The packaged order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /admin/orders/{id}/refund:
    parameters:
      - $ref: '#/components/parameters/OrderID'
    post:
      summary: Refund part of a placed order
      description: |
        A goodwill refund through yc-payment, at most what is left. The
        Idempotency-Key also keys the payment refund, so a retry refunds
        once.
      operationId: refundOrder
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefundInput' }
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /admin/returns:
    get:
      summary: List the shop's returns, newest first
      operationId: listReturns
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ReturnStatus' }
      responses:
        '200':
          description: A page of returns.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReturnList' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

  /admin/returns/{id}/accept:
    parameters:
      - $ref: '#/components/parameters/ReturnID'
    post:
      summary: Accept a return and refund it
      description: |
        Refunds the returned lines' share of their totals through
        yc-payment at once, plus shipping when refund_shipping is set (once
        per order). When every physical line has been returned the order
        becomes returned. Accepting again returns the return.
      operationId: acceptReturn
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptReturnInput' }
      responses:
        '200':
          description: The accepted return.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Return' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /admin/returns/{id}/reject:
    parameters:
      - $ref: '#/components/parameters/ReturnID'
    post:
      summary: Reject a return
      operationId: rejectReturn
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RejectReturnInput' }
      responses:
        '200':
          description: The rejected return.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Return' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /internal/orders:
    post:
      summary: Create a pending order
      description: |
        yc-checkout's ORDER_CREATE step, with Idempotency-Key
        {session_id}:order. A checkout session has one order; creating it
        again returns it. No event is published until confirmation.
      operationId: createOrder
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrderInput' }
      responses:
        '201':
          description: The pending order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /internal/orders/{id}:
    parameters:
      - $ref: '#/components/parameters/OrderID'
    get:
      summary: Get an order, whatever its status
      operationId: getInternalOrder
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404': { $ref: '#/components/responses/Problem' }

  /internal/orders/{id}/guest-access:
    parameters:
      - $ref: '#/components/parameters/OrderID'
    get:
      summary: Mint a guest order access token
      description: |
        For yc-message: a signed, time-limited token so guest order emails can
        link to `/orders/{id}?guest_token=…` (ADR-027 rule 12, issue #22).
        Only placed visitor orders; customer orders are 404.
      operationId: mintGuestAccess
      responses:
        '200':
          description: The token and when it expires.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuestAccess' }
        '404': { $ref: '#/components/responses/Problem' }

  /internal/purchases:
    get:
      summary: Find a customer's purchase of a product
      description: |
        The customer's latest placed order with a line of the product,
        unless it was cancelled; for yc-review's verified purchase check
        (ADR-024). Guest orders do not count.
      operationId: findPurchase
      parameters:
        - name: user_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: product_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Whether the customer bought the product.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Purchase' }
        '400': { $ref: '#/components/responses/Problem' }

  /internal/customer-orders:
    get:
      summary: List a customer's orders for GDPR deletion
      description: |
        The orders of the given users (a customer and, after deletion,
        their pseudonym), newest first, up to 1000. open_count counts
        those still in progress or with a return awaiting a decision:
        yc-identity refuses to delete the customer while it is above zero,
        and yc-shipping finds the shipments to clear (ADR-005).
      operationId: listCustomerOrders
      parameters:
        - name: user_id
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 10
            items: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '200':
          description: The customer's orders.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerOrders' }
        '400': { $ref: '#/components/responses/Problem' }

  /internal/orders/address-in-use:
    get:
      summary: Whether a delivery address book id is on an open order
      description: |
        For yc-identity's address-book lock (issue #32). in_use is true when
        any order in the tenant has delivery_address_id equal to address_id
        and Status.Open() (pending_payment, received, packaged, shipped,
        delivery_exception).
      operationId: addressInUse
      parameters:
        - name: address_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Lock status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AddressInUse' }
        '400': { $ref: '#/components/responses/Problem' }

  /internal/orders/{id}/confirm:
    parameters:
      - $ref: '#/components/parameters/OrderID'
    post:
      summary: Confirm a paid order
      description: |
        yc-checkout's CONFIRMING step, after capture: the order becomes
        received, gets its number and order.placed.v1 is published.
        Confirming a received order returns it; an abandoned one is 409.
      operationId: confirmOrder
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmInput' }
      responses:
        '200':
          description: The placed order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /internal/orders/{id}/abandon:
    parameters:
      - $ref: '#/components/parameters/OrderID'
    post:
      summary: Abandon a pending order
      description: |
        Checkout compensation. No event is published. Abandoning again,
        or an order that was never created (status none), succeeds; a
        placed order is 409.
      operationId: abandonOrder
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonInput' }
      responses:
        '200':
          description: The outcome.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AbandonResult' }
        '409': { $ref: '#/components/responses/Problem' }

components:
  parameters:
    OrderID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReturnID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 255 }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }

  schemas:
    CustomerOrders:
      type: object
      required: [orders, open_count]
      properties:
        orders:
          type: array
          items: { $ref: '#/components/schemas/CustomerOrder' }
        open_count: { type: integer }
    CustomerOrder:
      type: object
      required: [order_id, status, open_return]
      properties:
        order_id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/OrderStatus' }
        open_return: { type: boolean, description: A return awaits the shop's decision. }
    AddressInUse:
      type: object
      required: [in_use]
      properties:
        in_use: { type: boolean }
        order_ids:
          type: array
          items: { type: string, format: uuid }
          description: Open orders that reference the address (may be truncated).
    Purchase:
      type: object
      required: [purchased]
      properties:
        purchased: { type: boolean }
        order_id: { type: string, format: uuid }
        order_number: { type: string }
        placed_at: { type: string, format: date-time }
    Money:
      type: object
      required: [amount_minor, currency]
      properties:
        amount_minor: { type: integer, format: int64, description: Minor units (cents). }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
    OrderStatus:
      type: string
      enum: [pending_payment, abandoned, received, cancelled, packaged, shipped, delivered, delivery_exception,
        returned, disputed]
    ReturnStatus:
      type: string
      enum: [requested, accepted, rejected]
    ReturnItem:
      type: object
      required: [sku_id, quantity]
      properties:
        sku_id: { type: string, format: uuid }
        quantity: { type: integer, format: int64, minimum: 1 }
    ReturnInput:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/ReturnItem' }
        reason: { type: string, maxLength: 500 }
    AcceptReturnInput:
      type: object
      additionalProperties: false
      properties:
        refund_shipping: { type: boolean, default: false, description: Refund the order's shipping too. }
        note: { type: string, maxLength: 500 }
    RejectReturnInput:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
    Return:
      type: object
      required: [return_id, order_id, status, items, refund_shipping, refund, requested_at]
      properties:
        return_id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/ReturnStatus' }
        items:
          type: array
          items: { $ref: '#/components/schemas/ReturnItem' }
        reason: { type: string }
        refund_shipping: { type: boolean }
        refund: { type: integer, format: int64, description: Minor units refunded on acceptance. }
        decision_reason: { type: string }
        requested_at: { type: string, format: date-time }
        decided_at: { type: string, format: date-time }
    ReturnList:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Return' }
        page: { $ref: '#/components/schemas/PageInfo' }
    RefundInput:
      type: object
      required: [amount_minor, reason]
      additionalProperties: false
      properties:
        amount_minor: { type: integer, format: int64, minimum: 1 }
        reason: { type: string, minLength: 1, maxLength: 500 }
    Refund:
      type: object
      required: [refund_id, amount, status, reason, created_at]
      properties:
        refund_id: { type: string, format: uuid }
        return_id: { type: string, format: uuid }
        amount: { $ref: '#/components/schemas/Money' }
        status: { type: string, enum: [pending, completed] }
        reason: { type: string }
        created_at: { type: string, format: date-time }
    OrderShipment:
      type: object
      required: [shipment_id, tracking_number]
      properties:
        shipment_id: { type: string, format: uuid }
        tracking_number: { type: string }
        carrier_name: { type: string }
        carrier_reference: { type: string }
        packaged_at: { type: string, format: date-time }
        shipped_at: { type: string, format: date-time }
        delivered_at: { type: string, format: date-time }
    GuestContact:
      type: object
      required: [email, phone_e164]
      properties:
        email: { type: string, maxLength: 254 }
        phone_e164: { type: string, maxLength: 16 }
    GuestAccess:
      type: object
      required: [token, expires_at]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 512
          description: Opaque signed token for `GET /orders/{id}?guest_token=`.
        expires_at: { type: string, format: date-time }
    OrderItemInput:
      type: object
      required: [sku_id, name_snapshot, quantity, unit_price_minor, line_total_minor]
      properties:
        sku_id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        sku_code: { type: string, maxLength: 100 }
        name_snapshot: { type: string, minLength: 1, maxLength: 500 }
        variant_values_snapshot: { type: object, additionalProperties: true }
        quantity: { type: integer, format: int64, minimum: 1 }
        unit_price_minor: { type: integer, format: int64, description: 'Gross, as charged.' }
        line_total_minor: { type: integer, format: int64, description: 'Gross; tax is rounded per line, so not always unit price times quantity.' }
        tax_minor: { type: integer, format: int64, description: Tax included in the line total. }
        is_digital: { type: boolean }
    OrderItem:
      type: object
      required: [sku_id, sku_code, name_snapshot, quantity, unit_price, line_total, tax, is_digital]
      properties:
        sku_id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        sku_code: { type: string }
        name_snapshot: { type: string }
        variant_values_snapshot: { type: object, additionalProperties: true }
        quantity: { type: integer, format: int64 }
        unit_price: { $ref: '#/components/schemas/Money' }
        line_total: { $ref: '#/components/schemas/Money' }
        tax: { $ref: '#/components/schemas/Money' }
        is_digital: { type: boolean }
    Payment:
      type: object
      required: [gateway]
      properties:
        transaction_id: { type: string, format: uuid }
        gateway: { type: string, maxLength: 50 }
    BillingAddress:
      type: object
      description: Structured SA billing for tax invoices (issue #29; ADR-015 amendment).
      required: [street_and_number, town_city, postal_code]
      additionalProperties: false
      properties:
        company_name: { type: string, maxLength: 200 }
        vat_number: { type: string, maxLength: 16 }
        street_and_number: { type: string, minLength: 1, maxLength: 200 }
        suburb: { type: string, maxLength: 200 }
        town_city: { type: string, minLength: 1, maxLength: 200 }
        postal_code: { type: string, minLength: 1, maxLength: 200 }
        country_code: { type: string, minLength: 2, maxLength: 2 }
    SellerInvoice:
      type: object
      description: Shop identity snapshotted at order place (issue #29).
      required: [name, contact_email]
      additionalProperties: false
      properties:
        name: { type: string }
        contact_email: { type: string }
        vat_number: { type: string }
        invoice_address: { $ref: '#/components/schemas/BillingAddress' }
    CreateOrderInput:
      type: object
      required: [checkout_session_id, user_id, user_type, requires_shipping, items, currency, items_total_minor,
        shipping_minor, tax_total_minor, total_minor, pricing_snapshot]
      additionalProperties: false
      properties:
        checkout_session_id: { type: string, format: uuid }
        user_id: { type: string, minLength: 1, maxLength: 100 }
        user_type: { type: string, enum: [customer, visitor] }
        guest_contact: { $ref: '#/components/schemas/GuestContact' }
        delivery_address:
          type: object
          additionalProperties: true
          description: Free-form address (ADR-015); required with physical items.
        delivery_address_id:
          type: string
          format: uuid
          description: |
            Optional customer address-book id (issue #32). Snapshotted with
            delivery_address; guests omit it.
        billing_address:
          $ref: '#/components/schemas/BillingAddress'
          description: |
            Optional buyer billing snapshot. When omitted for a customer,
            yc-orders loads GET /internal/users/{id}/billing (issue #29).
        requires_shipping: { type: boolean }
        items:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/OrderItemInput' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        items_total_minor: { type: integer, format: int64 }
        shipping_minor: { type: integer, format: int64 }
        tax_total_minor: { type: integer, format: int64 }
        total_minor: { type: integer, format: int64 }
        pricing_snapshot: { type: object, additionalProperties: true, description: The full pricing result. }
        shipping_option: { type: object, additionalProperties: true }
        delivery_slot:
          $ref: '#/components/schemas/DeliverySlot'
          description: Chosen delivery window from checkout (issue #30); snapshotted on the order.
        payment: { $ref: '#/components/schemas/Payment' }
    DeliverySlot:
      type: object
      required: [slot_id, start_at, end_at, timezone]
      additionalProperties: false
      properties:
        slot_id: { type: string }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }
        timezone: { type: string }
        label: { type: string }
        schedule_id: { type: string, format: uuid }
    ConfirmInput:
      type: object
      additionalProperties: false
      properties:
        payment_transaction_id: { type: string, format: uuid }
    ReasonInput:
      type: object
      additionalProperties: false
      properties:
        reason: { type: string, maxLength: 500 }
    AbandonResult:
      type: object
      required: [status]
      properties:
        order_id: { type: string, format: uuid }
        status:
          type: string
          enum: [abandoned, none]
    HistoryEntry:
      type: object
      required: [to_status, created_at]
      properties:
        from_status: { $ref: '#/components/schemas/OrderStatus' }
        to_status: { $ref: '#/components/schemas/OrderStatus' }
        reason: { type: string }
        created_at: { type: string, format: date-time }
    OrderSummary:
      type: object
      required: [order_id, status, user_type, requires_shipping, total, item_count, created_at]
      properties:
        order_id: { type: string, format: uuid }
        order_number: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        user_type: { type: string, enum: [customer, visitor] }
        requires_shipping: { type: boolean }
        total: { $ref: '#/components/schemas/Money' }
        item_count: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        placed_at: { type: string, format: date-time }
    Order:
      type: object
      required: [order_id, checkout_session_id, user_id, user_type, requires_shipping, status, items, items_total,
        shipping, tax_total, total, refunded, created_at, updated_at]
      properties:
        order_id: { type: string, format: uuid }
        order_number: { type: string }
        checkout_session_id: { type: string, format: uuid }
        user_id: { type: string }
        user_type: { type: string, enum: [customer, visitor] }
        guest_contact: { $ref: '#/components/schemas/GuestContact' }
        delivery_address: { type: object, additionalProperties: true }
        delivery_address_id:
          type: string
          format: uuid
          description: Book entry used at checkout (issue #32).
        billing_address: { $ref: '#/components/schemas/BillingAddress' }
        seller_invoice: { $ref: '#/components/schemas/SellerInvoice' }
        delivery_slot: { $ref: '#/components/schemas/DeliverySlot' }
        requires_shipping: { type: boolean }
        status: { $ref: '#/components/schemas/OrderStatus' }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItem' }
        items_total: { $ref: '#/components/schemas/Money' }
        shipping: { $ref: '#/components/schemas/Money' }
        tax_total: { $ref: '#/components/schemas/Money' }
        total: { $ref: '#/components/schemas/Money' }
        refunded: { $ref: '#/components/schemas/Money' }
        payment: { $ref: '#/components/schemas/Payment' }
        shipping_method: { type: string, description: The shipping option chosen at checkout. }
        shipment: { $ref: '#/components/schemas/OrderShipment' }
        history:
          type: array
          items: { $ref: '#/components/schemas/HistoryEntry' }
        returns:
          type: array
          items: { $ref: '#/components/schemas/Return' }
        refunds:
          type: array
          items: { $ref: '#/components/schemas/Refund' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        placed_at: { type: string, format: date-time }
    OrderList:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderSummary' }
        page: { $ref: '#/components/schemas/PageInfo' }
    PageInfo:
      type: object
      description: Cursor pagination (api-conventions.md §7).
      x-go-type: httpkit.PageInfo
      x-go-type-import:
        path: github.com/slaghuis/yc-platform/libs/yc-httpkit
        name: httpkit
      required: [size]
      properties:
        size: { type: integer }
        cursor: { type: string }
        next_cursor: { type: string }
        total_available: { type: integer }
    Problem:
      type: object
      description: RFC 9457 problem details (docs/standards/error-handling.md).
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
        correlation_id: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [field, code, message]
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }

  responses:
    Problem:
      description: An error.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
