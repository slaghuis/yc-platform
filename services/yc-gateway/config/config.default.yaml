service: yc-gateway
environment: ${YC_ENVIRONMENT:-dev}
http:
  listen: ":8080"
# Registration endpoints (ADR-020 rule 6) and service-to-service calls
# (ADR-021). Never expose outside the platform network: the registration
# endpoints have no authentication.
internal_http:
  listen: ":8091"
log:
  level: ${LOG_LEVEL:-info}
database:
  url: ${YC_GATEWAY_DB_URL}
  migrate_on_start: true
nats:
  url: ${NATS_URL}
telemetry:
  otlp_endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}

# Backend base URLs by name. Override one with YC_GATEWAY__UPSTREAMS__<NAME>.
upstreams:
  identity: http://yc-identity:8080

# Static routes (docs/services/yc-gateway.md, Routing). Longest prefix wins;
# empty roles admit any actor, visitors included. /internal/ is never routed
# here. Services add their own routes by registering; a registered route may
# not reuse a static prefix.
routes:
  - prefix: /me
    methods: [GET, DELETE]
    upstream: identity
  - prefix: /register
    methods: [POST]
    upstream: identity
  - prefix: /login
    methods: [POST]
    upstream: identity
    anonymous: true
  - prefix: /refresh
    methods: [POST]
    upstream: identity
    anonymous: true
  - prefix: /logout
    methods: [POST]
    upstream: identity
  - prefix: /password
    methods: [POST]
    upstream: identity
    anonymous: true
  - prefix: /oauth
    methods: [POST]
    upstream: identity
  - prefix: /admin/users
    upstream: identity
    roles: [shop_admin, system_admin]

# Registered services are polled at health_url; failure_threshold
# consecutive failures deregister them (ADR-020 rule 7).
registry:
  health_interval: 5s
  health_timeout: 2s
  failure_threshold: 3
  # /readyz stays unready this long after start while services re-register
  # (every gateway.interval, 5s), so a load balancer holds traffic back.
  startup_grace: 10s

# Hostnames that resolve to _platform: system admins only, no visitors
# (ADR-020 rule 5).
platform_hosts: []

# Static hostname → tenant map, loaded before tenant_hosts (ADR-020). Tenants
# are normally added by platform.tenant.provisioned.v1.
tenant_hosts: []
tenant_hosts_refresh: 30s

# Token buckets per gateway instance (docs/services/yc-gateway.md, Rate
# Limiting): requests per period, up to burst at once; requests 0 is
# unlimited. Visitors, and callers without credentials (by address), get the
# stricter visitor quota.
rate_limit:
  enabled: ${YC_GATEWAY_RATE_LIMIT:-true}
  tenant: {requests: 200, per: 1s, burst: 400}
  tenant_overrides: {}
  actor: {requests: 600, per: 1m, burst: 60}
  visitor: {requests: 120, per: 1m, burst: 30}
  idle_ttl: 10m

# Load balancers in front of the gateway (addresses or CIDRs). Requests from
# them are limited by the client address they append to X-Forwarded-For;
# without them every caller without credentials shares the balancer's
# address. Override with YC_GATEWAY__TRUSTED_PROXIES=10.0.0.0/8,...
trusted_proxies: []

token_cache_ttl: 60s
identity_timeout: 3s
# Secure needs HTTPS; local development over plain HTTP turns it off.
visitor_cookie:
  name: yc_visitor
  secure: ${YC_GATEWAY_COOKIE_SECURE:-true}
