service: yc-payment
environment: ${YC_ENVIRONMENT:-dev}
http:
  listen: ":8080"
log:
  level: ${LOG_LEVEL:-info}
database:
  url: ${YC_PAYMENT_DB_URL}
  migrate_on_start: true
nats:
  url: ${NATS_URL}
telemetry:
  otlp_endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}
# Self-registration with yc-gateway's internal listener (ADR-020 rule 7).
gateway:
  internal_url: ${YC_GATEWAY_INTERNAL_URL}
  advertise_url: ${YC_PAYMENT_ADVERTISE_URL:-http://yc-payment:8080}
  interval: 5s
# Shops' gateway credentials are sealed with AES-256-GCM under this key
# (base64 of 32 bytes; generate with `openssl rand -base64 32`). Changing
# it makes stored credentials unreadable: shops must enter them again.
encryption:
  cipher_key: ${YC_PAYMENT_CIPHER_KEY}
gateways:
  stripe:
    # Tests point this at a fake.
    api_base: ${YC_PAYMENT_STRIPE_API_BASE:-https://api.stripe.com}
    timeout: 30s
  yoco:
    # The Checkout API; tests and the demo point this at a fake.
    api_base: ${YC_PAYMENT_YOCO_API_BASE:-https://payments.yoco.com}
    timeout: 30s
