openapi: 3.1.0
info:
  title: yc-checkout
  version: 0.1.0
  description: |
    Checkout (docs/services/yc-checkout.md). POST /checkout snapshots the
    caller's cart, prices it and routes the payment to one of the shop's
    gateways by currency (ADR-013); the quote is honoured until the session
    expires (ADR-011, 30 minutes). Confirm runs the saga inline (ADR-019)
    and compensates any failure before the payment is taken. A gateway
    that authorizes separately (Stripe) runs Variant A: RESERVING,
    AUTHORIZING, ORDER_CREATE, CAPTURING, CONFIRMING. One that does not
    (Yoco) runs Variant B: RESERVING, ORDER_CREATE, CHARGING, CONFIRMING.

    Routes are reached through yc-gateway, which sets X-YC-Tenant-ID,
    X-YC-Actor-ID, X-YC-Actor-Type and X-YC-Correlation-ID
    (api-conventions.md §9). Customers and visitors (guest checkout,
    ADR-010) see only their own sessions. Amounts are integer minor units
    of the store currency. Errors are application/problem+json
    (error-handling.md).

paths:
  /checkout:
    post:
      summary: Start a checkout from my cart
      description: |
        Reads the cart, the SKUs and an authoritative price with tax. Physical
        items get the flat-fee Standard shipping option, selected; a
        digital-only checkout has no shipping and needs no address. An empty
        or non-convertible cart, an unavailable SKU (unavailable_skus) or an
        unpriced one (unpriced) is 409, as is a shop that takes no payments
        in the store currency. The session's payment names the routed
        gateway, its flow and whether the customer pays on the gateway's
        page (hosted). Publishes checkout.started.v1 and checkout.priced.v1.
      operationId: startCheckout
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartInput' }
      responses:
        '201':
          description: The session, in PRICING.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /checkout/{id}:
    get:
      summary: Get my session
      description: Poll this after a 202 from confirm.
      operationId: getCheckout
      parameters:
        - $ref: '#/components/parameters/SessionID'
      responses:
        '200':
          description: The session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '404': { $ref: '#/components/responses/Problem' }

  /checkout/{id}/shipping:
    post:
      summary: Choose where and how to ship
      description: |
        Before confirm only, for physical items. A delivery address is
        quoted with yc-shipping (the shop's zones and rates; untaxed) and
        the named option, or the cheapest, is selected; 409 when the shop
        does not ship there. Without an address, chooses among the current
        address's options. Publishes checkout.shipping_selected.v1.
      operationId: selectShipping
      parameters:
        - $ref: '#/components/parameters/SessionID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShippingInput' }
      responses:
        '200':
          description: The session with its new totals.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '410': { $ref: '#/components/responses/Problem' }

  /checkout/{id}/confirm:
    post:
      summary: Confirm and pay
      description: |
        Validates the guest contact, delivery address and shipping option
        (ADR-010; 400 and checkout.validation_failed.v1 otherwise), then runs
        the saga inline (ADR-019 rule 7). After 3-D Secure, call again with
        the same Idempotency-Key; another key for a confirmed session is 409.
        An expired session is 410. A hosted payment (Yoco) answers 202 in
        CHARGING with payment.next_action redirect_to_url: send the customer
        there; the gateway's webhook settles the payment and the session
        completes on its own.
      operationId: confirmCheckout
      parameters:
        - $ref: '#/components/parameters/SessionID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmInput' }
      responses:
        '200':
          description: COMPLETED; the order is placed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '202':
          description: |
            Still in progress: the payment needs the customer (payment.next_action),
            compensation is retrying, or the 60 s deadline passed. Poll GET
            /checkout/{id}.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '422':
          description: FAILED or EXPIRED, with failure.reason; compensation has finished.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '410': { $ref: '#/components/responses/Problem' }

  /checkout/{id}/cancel:
    post:
      summary: Cancel my checkout
      description: |
        Before confirm, or while the payment waits on the customer (the
        authorization is voided, the pending order abandoned and stock
        released). A hosted payment page cannot be closed: if the customer
        pays on it after all, the payment is refunded. 409 once the saga
        runs on its own.
      operationId: cancelCheckout
      parameters:
        - $ref: '#/components/parameters/SessionID'
      responses:
        '200':
          description: The session, FAILED with reason cancelled (or still compensating).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /admin/sessions:
    get:
      summary: List the shop's checkout sessions, newest first
      operationId: listSessions
      parameters:
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/State' }
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of sessions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionList' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

  /admin/sessions/{id}:
    get:
      summary: A session with its compensation log and history
      operationId: getSession
      parameters:
        - $ref: '#/components/parameters/SessionID'
      responses:
        '200':
          description: The session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSession' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /internal/sessions/{id}:
    get:
      summary: A session for a service
      operationId: getInternalSession
      parameters:
        - $ref: '#/components/parameters/SessionID'
      responses:
        '200':
          description: The session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSession' }
        '404': { $ref: '#/components/responses/Problem' }

components:
  parameters:
    SessionID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 255 }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }

  schemas:
    Money:
      type: object
      description: An amount in integer minor units of an ISO 4217 currency.
      x-go-type: money.Money
      x-go-type-import:
        path: github.com/slaghuis/yc-platform/libs/yc-money
        name: money
      required: [amount_minor, currency]
      properties:
        amount_minor: { type: integer, format: int64 }
        currency: { type: string }
    State:
      type: string
      enum: [PRICING, RESERVING, AUTHORIZING, ORDER_CREATE, CHARGING, CAPTURING, CONFIRMING, COMPLETED, COMPENSATING,
        FAILED, EXPIRED]
    StartInput:
      type: object
      additionalProperties: false
      properties:
        cart_type: { type: string, maxLength: 32, description: Defaults to shopping. }
    ShippingInput:
      type: object
      additionalProperties: false
      description: A delivery address to quote, an option of the current address, or both.
      properties:
        delivery_address:
          type: object
          additionalProperties: true
          description: |
            Free-form (ADR-015); yc-shipping matches its country_code and
            fields to the shop's zones. Replaces an earlier address and its
            options.
        shipping_option_id: { type: string, maxLength: 64, description: Defaults to the cheapest option. }
    GuestContact:
      type: object
      required: [email, phone_e164]
      additionalProperties: false
      properties:
        email: { type: string, maxLength: 254 }
        phone_e164: { type: string, maxLength: 16, description: 'E.164, e.g. +27831234567.' }
    ConfirmInput:
      type: object
      additionalProperties: false
      properties:
        guest_contact: { $ref: '#/components/schemas/GuestContact' }
        delivery_address:
          type: object
          additionalProperties: true
          description: |
            Optional: physical items ship to the address chosen at the
            shipping step. A different one here is 409; choose shipping
            again.
        shipping_option_id: { type: string, maxLength: 64, description: Defaults to the selected option. }
        payment_gateway:
          type: string
          maxLength: 32
          description: Another of the shop's gateways for the store currency; defaults to the session's.
        payment_gateway_token:
          type: string
          maxLength: 255
          description: 'The gateway SDK payment method, e.g. pm_...; required unless the payment is hosted.'
        return_url:
          type: string
          maxLength: 2048
          description: Where a 3-D Secure redirect or the gateway's payment page returns to; required when hosted.
    SessionItem:
      type: object
      required: [sku_id, sku_code, name, quantity, is_digital, inventory_tracked, unit_price, line_total, tax]
      properties:
        sku_id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        sku_code: { type: string }
        name: { type: string }
        variant_values: { type: object, additionalProperties: true }
        quantity: { type: integer, format: int64 }
        is_digital: { type: boolean }
        inventory_tracked: { type: boolean }
        unit_price: { $ref: '#/components/schemas/Money' }
        line_total: { $ref: '#/components/schemas/Money' }
        tax: { $ref: '#/components/schemas/Money' }
    ShippingOption:
      type: object
      required: [id, name, amount]
      properties:
        id: { type: string }
        name: { type: string }
        amount: { $ref: '#/components/schemas/Money' }
        estimated_days_min: { type: integer }
        estimated_days_max: { type: integer }
    Totals:
      type: object
      required: [items_total, tax_total, shipping, total]
      properties:
        items_total: { $ref: '#/components/schemas/Money' }
        tax_total: { $ref: '#/components/schemas/Money' }
        shipping: { $ref: '#/components/schemas/Money' }
        total: { $ref: '#/components/schemas/Money' }
    PaymentState:
      type: object
      required: [gateway, flow, hosted]
      properties:
        gateway: { type: string }
        flow:
          type: string
          enum: [auth_capture, charge]
          description: auth_capture (Variant A) or a single charge (Variant B).
        hosted:
          type: boolean
          description: The customer pays on the gateway's page; confirm sends a return_url and no token.
        public_key: { type: string, description: "The gateway's publishable key, for its client SDK." }
        transaction_id: { type: string, format: uuid }
        status: { type: string }
        next_action:
          type: object
          additionalProperties: true
          description: While the payment waits on the customer, what to do, as the gateway describes it.
    ReservationState:
      type: object
      required: [reservation_id]
      properties:
        reservation_id: { type: string, format: uuid }
        expires_at: { type: string, format: date-time }
    OrderRef:
      type: object
      required: [order_id]
      properties:
        order_id: { type: string, format: uuid }
        order_number: { type: string }
    Failure:
      type: object
      required: [state, reason]
      properties:
        state: { $ref: '#/components/schemas/State' }
        reason:
          type: string
          description: insufficient_stock, payment_declined, capture_failed, reservation_expired, session_expired, cancelled or step_failed.
        detail:
          type: object
          additionalProperties: true
          description: For customers, only shortages or decline_reason.
    Session:
      type: object
      required: [session_id, state, user_type, cart_type, items, requires_shipping, shipping_options, totals,
        tax_inclusive, expires_at, created_at, updated_at]
      properties:
        session_id: { type: string, format: uuid }
        state: { $ref: '#/components/schemas/State' }
        user_type: { type: string, enum: [customer, visitor] }
        cart_type: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/SessionItem' }
        requires_shipping: { type: boolean }
        shipping_options:
          type: array
          items: { $ref: '#/components/schemas/ShippingOption' }
        selected_shipping_option_id: { type: string }
        totals: { $ref: '#/components/schemas/Totals' }
        tax_inclusive: { type: boolean, description: 'Show gross prices when true, net otherwise.' }
        payment: { $ref: '#/components/schemas/PaymentState' }
        reservation: { $ref: '#/components/schemas/ReservationState' }
        order: { $ref: '#/components/schemas/OrderRef' }
        failure: { $ref: '#/components/schemas/Failure' }
        expires_at: { type: string, format: date-time }
        confirmed_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CompensationEntry:
      type: object
      required: [step, result, at]
      properties:
        step: { type: string, enum: [payment_voided, order_abandoned, reservation_released, late_charge_refunded] }
        result: { type: string }
        at: { type: string, format: date-time }
    HistoryEntry:
      type: object
      required: [event_type, created_at]
      properties:
        event_type: { type: string }
        from_state: { $ref: '#/components/schemas/State' }
        to_state: { $ref: '#/components/schemas/State' }
        payload: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
    AdminSession:
      allOf:
        - $ref: '#/components/schemas/Session'
        - type: object
          required: [user_id, compensation_log, attempts]
          properties:
            user_id: { type: string }
            guest_contact: { $ref: '#/components/schemas/GuestContact' }
            delivery_address: { type: object, additionalProperties: true }
            compensation_log:
              type: array
              items: { $ref: '#/components/schemas/CompensationEntry' }
            attempts: { type: integer }
            next_attempt_at: { type: string, format: date-time }
            history:
              type: array
              items: { $ref: '#/components/schemas/HistoryEntry' }
    SessionList:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminSession' }
        page: { $ref: '#/components/schemas/PageInfo' }
    PageInfo:
      type: object
      description: Cursor pagination (api-conventions.md §7).
      x-go-type: httpkit.PageInfo
      x-go-type-import:
        path: github.com/slaghuis/yc-platform/libs/yc-httpkit
        name: httpkit
      required: [size]
      properties:
        size: { type: integer }
        cursor: { type: string }
        next_cursor: { type: string }
        total_available: { type: integer }
    Problem:
      type: object
      description: RFC 9457 problem details (docs/standards/error-handling.md).
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
        correlation_id: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [field, code, message]
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }

  responses:
    Problem:
      description: An error.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
