openapi: 3.1.0
info:
  title: yc-analytics
  version: 0.2.0
  description: |
    Business analytics: revenue, top products, the conversion funnel and
    payment gateway performance, built from facts recorded off business
    events (docs/services/yc-analytics.md, ADR-025).

    Routes are reached through yc-gateway, which sets X-YC-Tenant-ID,
    X-YC-Actor-ID, X-YC-Actor-Type and X-YC-Correlation-ID
    (api-conventions.md §9). /admin routes are for a shop's admins and see
    only their shop; /sysadmin routes are for system admins and see every
    shop. Errors are application/problem+json (error-handling.md).

    Dates are UTC calendar dates and ranges include both ends. Without
    from and to a report covers the 30 days ending today; a range is at
    most 366 days. Amounts are integers in minor units of the row's
    currency. Figures come from aggregates that trail the facts by up to
    the refresh interval (pending_days counts the days waiting).

paths:
  /admin/analytics/dashboard:
    get:
      summary: Shop dashboard
      description: Revenue per currency, the funnel, the top 5 products and gateway performance.
      operationId: getShopDashboard
      parameters:
        - $ref: '#/components/parameters/FromParam'
        - $ref: '#/components/parameters/ToParam'
      responses:
        '200':
          description: The dashboard.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

  /admin/analytics/revenue:
    get:
      summary: Daily revenue
      description: |
        Per date and currency. Gross is the total of orders not cancelled,
        tax and shipping included; net is gross less refunds. Days without
        orders are left out.
      operationId: getRevenue
      parameters:
        - $ref: '#/components/parameters/FromParam'
        - $ref: '#/components/parameters/ToParam'
      responses:
        '200':
          description: Revenue per day.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RevenueSeries' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

  /admin/analytics/products/top:
    get:
      summary: Top products
      description: Best-selling SKUs on orders not cancelled.
      operationId: getTopProducts
      parameters:
        - $ref: '#/components/parameters/FromParam'
        - $ref: '#/components/parameters/ToParam'
        - name: by
          in: query
          schema: { type: string, enum: [revenue, units], default: revenue }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      responses:
        '200':
          description: The products, best first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductList' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

  /admin/analytics/funnel:
    get:
      summary: Conversion funnel
      description: |
        Visitors, shopping carts created, checkouts started and confirmed,
        and orders placed: totals and per day.
      operationId: getFunnel
      parameters:
        - $ref: '#/components/parameters/FromParam'
        - $ref: '#/components/parameters/ToParam'
      responses:
        '200':
          description: The funnel.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FunnelReport' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

  /admin/analytics/cart-recovery:
    get:
      summary: Cart abandonment and recovery rates
      description: |
        Issue #35. Abandonment rate = abandoned carts / funnel carts created
        in the period (distinct cart_id). Recovery rate = carts that converted
        within recovery_window (default 7 days) of abandoned_at / abandoned
        carts in the period (messaged ≈ abandoned, since touch 1 fires on
        announce). Rates are 0 when the denominator is 0.
      operationId: getCartRecovery
      parameters:
        - $ref: '#/components/parameters/FromParam'
        - $ref: '#/components/parameters/ToParam'
      responses:
        '200':
          description: The rates and counts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartRecoveryReport' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

  /admin/analytics/gateways:
    get:
      summary: Payment gateway performance
      description: |
        Payment transactions per gateway: attempts, successes (captured or
        charged), failures and the amount collected.
      operationId: getGateways
      parameters:
        - $ref: '#/components/parameters/FromParam'
        - $ref: '#/components/parameters/ToParam'
      responses:
        '200':
          description: Each gateway.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GatewayList' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

  /admin/analytics/export/{query}:
    get:
      summary: Export a report as CSV
      description: |
        revenue and funnel are daily rows; top_products is the top 100 by
        revenue; gateways is one row per gateway and currency; cart_recovery
        is a single summary row (issue #35).
      operationId: exportReport
      parameters:
        - name: query
          in: path
          required: true
          schema: { type: string, enum: [revenue, top_products, funnel, gateways, cart_recovery] }
        - $ref: '#/components/parameters/FromParam'
        - $ref: '#/components/parameters/ToParam'
      responses:
        '200':
          description: The report, with a header row.
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            text/csv:
              schema: { type: string }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /sysadmin/analytics/platform:
    get:
      summary: Platform dashboard
      description: The shop dashboard summed over every shop.
      operationId: getPlatformDashboard
      parameters:
        - $ref: '#/components/parameters/FromParam'
        - $ref: '#/components/parameters/ToParam'
      responses:
        '200':
          description: The dashboard.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

  /sysadmin/analytics/tenants/comparison:
    get:
      summary: Compare shops
      description: Every shop with orders or funnel activity in the range.
      operationId: compareTenants
      parameters:
        - $ref: '#/components/parameters/FromParam'
        - $ref: '#/components/parameters/ToParam'
      responses:
        '200':
          description: The shops.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantComparisonList' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

  /sysadmin/analytics/rebuild:
    post:
      summary: Rebuild aggregates
      description: |
        Replaces the aggregates of one shop, or every shop, over a date
        range with rows computed from the facts, and publishes
        analytics.aggregate.rebuilt.v1. Rebuilding again gives the same
        result.
      operationId: rebuildAggregates
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RebuildInput' }
      responses:
        '200':
          description: What was rebuilt.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RebuildResult' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

  /sysadmin/analytics/consistency:
    get:
      summary: Check aggregates against facts
      description: |
        Recomputes every aggregate from the facts over the range and lists
        the days that differ. Days still pending a refresh may show up;
        consistent is true when nothing differs.
      operationId: checkConsistency
      parameters:
        - $ref: '#/components/parameters/FromParam'
        - $ref: '#/components/parameters/ToParam'
        - name: tenant_id
          in: query
          schema: { type: string }
      responses:
        '200':
          description: The comparison.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Consistency' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

components:
  parameters:
    FromParam:
      name: from
      in: query
      description: The first date; defaults to 29 days before to.
      schema: { type: string, format: date }
    ToParam:
      name: to
      in: query
      description: The last date; defaults to today.
      schema: { type: string, format: date }

  schemas:
    DateRange:
      type: object
      required: [from, to]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }

    Revenue:
      type: object
      required: [currency, orders, cancelled, items_minor, tax_minor, shipping_minor, gross_minor, refunded_minor, net_minor, average_order_minor]
      properties:
        date: { type: string, format: date, description: Set in daily series. }
        currency: { type: string }
        orders: { type: integer, format: int64, description: Orders placed and not cancelled. }
        cancelled: { type: integer, format: int64 }
        items_minor: { type: integer, format: int64 }
        tax_minor: { type: integer, format: int64 }
        shipping_minor: { type: integer, format: int64 }
        gross_minor: { type: integer, format: int64 }
        refunded_minor: { type: integer, format: int64 }
        net_minor: { type: integer, format: int64 }
        average_order_minor: { type: integer, format: int64, description: Gross per order. }
    RevenueSeries:
      type: object
      required: [range, days]
      properties:
        range: { $ref: '#/components/schemas/DateRange' }
        days:
          type: array
          items: { $ref: '#/components/schemas/Revenue' }

    Funnel:
      type: object
      required: [visitors, carts_created, checkouts_started, checkouts_confirmed, orders_placed, conversion_rate]
      properties:
        date: { type: string, format: date, description: Set in daily rows. }
        visitors: { type: integer, format: int64 }
        carts_created: { type: integer, format: int64 }
        checkouts_started: { type: integer, format: int64 }
        checkouts_confirmed: { type: integer, format: int64 }
        orders_placed: { type: integer, format: int64 }
        conversion_rate:
          type: number
          format: double
          description: Orders per visitor, or per started checkout when no visitors were recorded.
    FunnelReport:
      type: object
      required: [range, total, days]
      properties:
        range: { $ref: '#/components/schemas/DateRange' }
        total: { $ref: '#/components/schemas/Funnel' }
        days:
          type: array
          items: { $ref: '#/components/schemas/Funnel' }

    CartRecoveryReport:
      type: object
      required:
        - range
        - carts_created
        - abandoned
        - messaged
        - recovered
        - abandonment_rate
        - recovery_rate
        - recovery_window
      properties:
        range: { $ref: '#/components/schemas/DateRange' }
        carts_created:
          type: integer
          format: int64
          description: Funnel cart.created events in the period.
        abandoned:
          type: integer
          format: int64
          description: Distinct carts with cart.abandoned in the period.
        messaged:
          type: integer
          format: int64
          description: Abandoned carts counted as messaged (touch 1 on announce).
        recovered:
          type: integer
          format: int64
          description: Messaged carts with cart.converted within recovery_window of abandon.
        abandonment_rate:
          type: number
          format: double
          description: abandoned / carts_created (0 when no carts created).
        recovery_rate:
          type: number
          format: double
          description: recovered / messaged (0 when none messaged).
        recovery_window:
          type: string
          description: Duration from abandoned_at used for recovery attribution (e.g. 168h).

    Product:
      type: object
      required: [sku_id, name, currency, units, revenue_minor]
      properties:
        sku_id: { type: string, format: uuid }
        name: { type: string, description: The name on the latest order. }
        currency: { type: string }
        units: { type: integer, format: int64 }
        revenue_minor: { type: integer, format: int64 }
    ProductList:
      type: object
      required: [range, products]
      properties:
        range: { $ref: '#/components/schemas/DateRange' }
        products:
          type: array
          items: { $ref: '#/components/schemas/Product' }

    Gateway:
      type: object
      required: [gateway, currency, attempts, successes, failures, amount_minor, success_rate]
      properties:
        gateway: { type: string }
        currency: { type: string }
        attempts: { type: integer, format: int64 }
        successes: { type: integer, format: int64 }
        failures: { type: integer, format: int64 }
        amount_minor: { type: integer, format: int64, description: Collected by successful transactions. }
        success_rate: { type: number, format: double }
    GatewayList:
      type: object
      required: [range, gateways]
      properties:
        range: { $ref: '#/components/schemas/DateRange' }
        gateways:
          type: array
          items: { $ref: '#/components/schemas/Gateway' }

    Dashboard:
      type: object
      required: [range, revenue, funnel, top_products, gateways, pending_days]
      properties:
        range: { $ref: '#/components/schemas/DateRange' }
        revenue:
          type: array
          description: Totals per currency, highest gross first.
          items: { $ref: '#/components/schemas/Revenue' }
        funnel: { $ref: '#/components/schemas/Funnel' }
        top_products:
          type: array
          items: { $ref: '#/components/schemas/Product' }
        gateways:
          type: array
          items: { $ref: '#/components/schemas/Gateway' }
        pending_days:
          type: integer
          format: int64
          description: Days with fact changes not yet in the aggregates.

    TenantComparison:
      type: object
      required: [tenant_id, name, revenue, funnel]
      properties:
        tenant_id: { type: string }
        name: { type: string, description: Empty when the shop's provisioning was not seen. }
        revenue:
          type: array
          items: { $ref: '#/components/schemas/Revenue' }
        funnel: { $ref: '#/components/schemas/Funnel' }
    TenantComparisonList:
      type: object
      required: [range, tenants]
      properties:
        range: { $ref: '#/components/schemas/DateRange' }
        tenants:
          type: array
          items: { $ref: '#/components/schemas/TenantComparison' }

    RebuildInput:
      type: object
      required: [from, to]
      properties:
        tenant_id: { type: string, description: One shop; every shop when left out. }
        from: { type: string, format: date }
        to: { type: string, format: date }
    RebuildResult:
      type: object
      required: [range, aggregates, rows]
      properties:
        tenant_id: { type: string }
        range: { $ref: '#/components/schemas/DateRange' }
        aggregates:
          type: array
          items: { type: string }
        rows: { type: integer, format: int64, description: Aggregate rows written. }

    Mismatch:
      type: object
      required: [aggregate, tenant_id, date]
      properties:
        aggregate: { type: string }
        tenant_id: { type: string }
        date: { type: string, format: date }
    Consistency:
      type: object
      required: [range, consistent, mismatches, pending_days]
      properties:
        range: { $ref: '#/components/schemas/DateRange' }
        consistent: { type: boolean }
        mismatches:
          type: array
          items: { $ref: '#/components/schemas/Mismatch' }
        pending_days: { type: integer, format: int64 }

    Problem:
      type: object
      description: RFC 9457 problem details (docs/standards/error-handling.md).
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
        correlation_id: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [field, code, message]
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }

  responses:
    Problem:
      description: An error.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
