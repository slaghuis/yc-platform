openapi: 3.1.0
info:
  title: yc-product
  version: 0.1.0
  description: |
    Catalog: suppliers, products, variants, SKUs, categories, banners and
    product images (docs/services/yc-product.md). Phase 2 subset.

    Routes are reached through yc-gateway, which sets X-YC-Tenant-ID,
    X-YC-Actor-ID, X-YC-Actor-Type and X-YC-Correlation-ID
    (api-conventions.md §9). /admin/ requires shop_admin and acts on the
    caller's shop. Prices are not part of the catalog: clients pass SKU IDs to
    yc-pricing's POST /prices/evaluate. Errors are application/problem+json
    (error-handling.md).

paths:
  /products:
    get:
      summary: Browse active products
      description: |
        Products with at least one active SKU. q is a web-style full-text
        query over product name, description, SKU code and variant values.

        category (repeatable) and exclude_category (repeatable) filter by
        category membership in the search projection. Each id expands to
        that category and its descendants. Multiple category values are
        AND: the product must match every listed id's subtree. Multiple
        exclude_category values drop a product that matches any listed
        id's subtree. Combined: (all positives) AND NOT (any exclude).
        At most 16 distinct ids per parameter. A well-formed unknown id
        contributes an empty subtree (positive → no match for that term;
        exclude → excludes nothing for that id).

        The view depends on the caller (role-contextualised search): visitors
        and customers get popular products first, shop admins the newest;
        customers also get a "My favourites" facet and filter. A cursor is
        valid only with the sort it was issued for.
      operationId: browseProducts
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
        - name: category
          in: query
          description: |
            Include products in each listed category's subtree (AND).
            Repeat the parameter for multiple ids. A single value keeps
            the previous single-category behaviour.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 16
            items: { type: string, format: uuid }
        - name: exclude_category
          in: query
          description: |
            Exclude products in each listed category's subtree. Repeat for
            multiple ids. Composed with category as AND NOT.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 16
            items: { type: string, format: uuid }
        - { name: supplier_id, in: query, schema: { type: string, format: uuid } }
        - name: in_stock
          in: query
          description: true keeps only products with an active SKU in stock.
          schema: { type: boolean }
        - name: favourites
          in: query
          description: Customers only. true keeps only products the customer has ordered.
          schema: { type: boolean }
        - name: sort
          in: query
          description: |
            popular (orders placed, shop-wide), newest, price_asc and
            price_desc by the lowest base price of the active SKUs, unpriced
            products last, or rating by the average of the approved reviews,
            unrated products last. Base prices are net or gross per the
            shop's tax setting (ADR-016).
          schema: { $ref: '#/components/schemas/Sort' }
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of products.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductList' }
        '400': { $ref: '#/components/responses/Problem' }

  /products/{id}:
    get:
      summary: Get a product with its variants, SKUs, categories, images and related product ids
      description: |
        Inactive products and SKUs are visible to shop admins only.

        related_product_ids is the editorial related list in display order
        (PUT /admin/products/{id}/related), ids only. Visitors and customers
        see only active targets that have an active SKU; shop admins see the
        stored list, inactive targets included. Always present, possibly empty.
        Not to be confused with GET /products/{id}/also-bought.

        kind is standard or bundle. When kind is bundle, bundle.components
        lists the flat component SKUs (sku_id, quantity, product facts).
      operationId: getProduct
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: The product.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '404': { $ref: '#/components/responses/Problem' }

  /products/{id}/also-bought:
    get:
      summary: Products customers also bought with this one
      description: |
        Active products with an active SKU that appear in the same placed
        orders (guests and customers) as this product, most orders first, ties
        by product id. The metric is the count of distinct placed orders that
        contain both products (SKUs resolved to products); the product itself
        is never returned. Derived from order.placed.v1 and independent of
        related_product_ids.

        The projection is eventually consistent: it lags orders by the usual
        event delay, so an empty or short list is normal, notably for new
        catalogue items. Cancellations and refunds are not subtracted. A
        product that is unknown, deleted or (for non-admins) inactive is a 404,
        as for GET /products/{id}.
      operationId: getAlsoBought
      parameters:
        - $ref: '#/components/parameters/ID'
        - name: limit
          in: query
          description: Most products to return, 1 to 24. Default 8.
          schema: { type: integer, minimum: 1, maximum: 24, default: 8 }
      responses:
        '200':
          description: The products, possibly none.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlsoBoughtList' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /skus/{id}:
    get:
      summary: Get a SKU
      operationId: getSKU
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: The SKU.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SKU' }
        '404': { $ref: '#/components/responses/Problem' }

  /categories:
    get:
      summary: The category tree
      description: |
        items is the shop's forest of root categories (multi-hierarchy =
        multiple roots). Each root and its descendants is one hierarchy;
        there is no separate hierarchy id. Each node may include image_id,
        the category icon — resolve it with yc-image GET /images/{id}.
      operationId: getCategoryTree
      responses:
        '200':
          description: Root categories with their descendants, by sort_order then name.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CategoryNode' }

  /banners:
    get:
      summary: The shop's banners
      description: |
        The shop admin's order. Each item is one category: its current name,
        a short text, and two yc-image ids. Resolve each image with
        GET /images/{id}. A click opens GET /products?category={category_id}.
        A banner whose category was deleted is not returned.
      operationId: listBanners
      responses:
        '200':
          description: Banners in display order.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Banner' }

  /suppliers:
    get:
      summary: Active suppliers of the shop (public fields)
      operationId: listPublicSuppliers
      responses:
        '200':
          description: Suppliers by name.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SupplierSummary' }

  /admin/products:
    post:
      summary: Create a product
      description: Publishes product.created.v1.
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

  /admin/products/{id}:
    put:
      summary: Replace a product's fields
      description: Publishes product.updated.v1.
      operationId: updateProduct
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      summary: Soft-delete a product and its SKUs
      description: Publishes product.deleted.v1 listing the deleted SKUs.
      operationId: deleteProduct
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '204': { description: Deleted. }
        '404': { $ref: '#/components/responses/Problem' }

  /admin/products/{id}/variants:
    post:
      summary: Add a variant axis
      description: |
        Only before the product has SKUs: existing SKUs would have no value
        on the new axis. Publishes product.variant.added.v1.
      operationId: addVariant
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VariantInput' }
      responses:
        '201':
          description: Added.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Variant' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /admin/products/{id}/skus:
    post:
      summary: Create a SKU
      description: |
        variant_values names a value on every variant axis of the product,
        and no other SKU of the product has the same combination.
        Publishes product.sku.created.v1.
      operationId: createSKU
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SKUInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SKU' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /admin/skus/{id}:
    put:
      summary: Replace a SKU's fields
      description: Publishes product.sku.updated.v1.
      operationId: updateSKU
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SKUInput' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SKU' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
    delete:
      summary: Soft-delete a SKU
      description: Publishes product.sku.deleted.v1.
      operationId: deleteSKU
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '204': { description: Deleted. }
        '404': { $ref: '#/components/responses/Problem' }

  /admin/products/{id}/related:
    put:
      summary: Replace a product's related products
      description: |
        Editorial merchandising: product_ids is the full ordered list of
        products that go with this one, replacing the stored list. An empty list
        clears it. Links are directed (A to B does not imply B to A). At most 20
        distinct ids; a repeated id keeps its first place. Rejects (400) a
        non-UUID, the product itself, and ids that are not live products of the
        shop (unknown, deleted or another shop's). Inactive targets are allowed.
        Soft-deleting a product removes its links in both directions; they are
        not restored on reactivation. Publishes product.related.updated.v1.
      operationId: putRelatedProducts
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RelatedProductsInput' }
      responses:
        '200':
          description: Replaced. Returns the stored list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RelatedProducts' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /admin/bundles:
    post:
      summary: Create a flat product bundle
      description: |
        Creates a physical kit product (kind=bundle, is_digital=false) with one
        SKU (no variants, inventory_tracked=false) composed of ≥2 distinct
        active non-bundle physical component SKUs. Publishes product.created.v1
        and product.sku.created.v1. Soft-deleting a component product or SKU
        retires dependent kits via product.deleted.v1.
      operationId: createBundle
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BundleInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /admin/bundles/{id}:
    get:
      summary: Get a bundle definition
      description: |
        Returns the kit product with bundle.components. 404 when the id is not
        a live bundle product of the shop.
      operationId: getBundle
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: The bundle product.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      summary: Replace a bundle's components
      description: |
        Replaces the component set of an existing kit (kind=bundle). Optionally
        updates name, description and category_ids. Components must still be
        ≥2 distinct active non-bundle physical SKUs. Publishes product.updated.v1.
      operationId: updateBundle
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BundleUpdateInput' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /admin/products/{id}/images:
    post:
      summary: Attach a yc-image image
      description: |
        Re-attaching an image updates its sort order and primary flag. A new
        primary image demotes the previous one. Publishes
        product.image_attached.v1.
      operationId: attachImage
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttachImageRequest' }
      responses:
        '201':
          description: Attached.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductImage' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /admin/products/{id}/images/{image_id}:
    delete:
      summary: Detach an image
      description: Publishes product.image_detached.v1.
      operationId: detachImage
      parameters:
        - $ref: '#/components/parameters/ID'
        - { name: image_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Detached. }
        '404': { $ref: '#/components/responses/Problem' }

  /admin/categories:
    post:
      summary: Create a category
      description: |
        image_id is an optional yc-image id for the category icon. The file is
        not checked. Publishes product.category.created.v2.
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /admin/categories/{id}:
    put:
      summary: Replace a category's fields
      description: |
        Omitting image_id clears the icon. The parent may not be the category
        or one of its descendants. Publishes product.category.updated.v2.
      operationId: updateCategory
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryInput' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
    delete:
      summary: Delete a category without subcategories
      description: |
        Products leave the category. A banner for the category is removed.
        Publishes product.category.deleted.v1 and product.banner.deleted.v1.
      operationId: deleteCategory
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '204': { description: Deleted. }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /admin/banners:
    post:
      summary: Create a banner
      description: |
        One banner per category. Both image ids are yc-image ids and are not
        checked. The large image must not be the category icon. The new banner
        is placed last. Publishes product.banner.created.v1.
      operationId: createBanner
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BannerInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Banner' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /admin/banners/order:
    put:
      summary: Reorder the shop's banners
      description: |
        ids lists every banner of the shop, once, in the new display order.
        Publishes product.banners.reordered.v1.
      operationId: reorderBanners
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BannerOrder' }
      responses:
        '204': { description: Reordered. }
        '400': { $ref: '#/components/responses/Problem' }

  /admin/banners/{id}:
    put:
      summary: Replace a banner's category, text and images
      description: |
        Order is unchanged. The large image must not be the category icon.
        Publishes product.banner.updated.v1.
      operationId: updateBanner
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BannerInput' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Banner' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
    delete:
      summary: Delete a banner
      description: Publishes product.banner.deleted.v1.
      operationId: deleteBanner
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '204': { description: Deleted. }
        '404': { $ref: '#/components/responses/Problem' }

  /internal/skus/batch:
    get:
      summary: Look up SKUs for a service
      description: |
        Service callers only (ADR-021). yc-checkout reads each line's SKU code,
        product name, variant values and the digital and inventory-tracked
        flags when a session starts. Deleted SKUs are returned with their
        status; unknown IDs are listed in missing.
      operationId: getSKUsBatch
      parameters:
        - name: ids
          in: query
          required: true
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            maxItems: 100
            items: { type: string, format: uuid }
      responses:
        '200':
          description: The SKUs found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SKUBatch' }
        '400': { $ref: '#/components/responses/Problem' }

  /admin/suppliers:
    post:
      summary: Create a supplier in the caller's shop
      description: Publishes product.supplier.created.v1 in the shop's tenant.
      operationId: createSupplier
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSupplierRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Supplier' }
        '400': { $ref: '#/components/responses/Problem' }
    get:
      summary: List the caller's suppliers
      description: Full records, newest first, including inactive suppliers.
      operationId: listSuppliers
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of suppliers, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupplierList' }
        '400': { $ref: '#/components/responses/Problem' }

  /admin/suppliers/{id}:
    get:
      summary: Get a supplier in the caller's shop
      operationId: getSupplier
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: The supplier.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Supplier' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      summary: Replace a supplier's fields
      description: Publishes product.supplier.updated.v1.
      operationId: updateSupplier
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateSupplierRequest' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Supplier' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      summary: Delete a supplier no product references
      description: Publishes product.supplier.deleted.v1.
      operationId: deleteSupplier
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '204': { description: Deleted. }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

components:
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }

  schemas:
    Status:
      type: string
      enum: [active, inactive]
    Contact:
      type: object
      additionalProperties: { type: string }
      description: Free-form contact fields, e.g. email, phone.
    Supplier:
      type: object
      required: [supplier_id, tenant_id, name, contact, status, created_at, updated_at]
      properties:
        supplier_id: { type: string, format: uuid }
        tenant_id: { type: string }
        name: { type: string }
        contact: { $ref: '#/components/schemas/Contact' }
        status: { $ref: '#/components/schemas/Status' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SupplierSummary:
      type: object
      required: [supplier_id, name]
      properties:
        supplier_id: { type: string, format: uuid }
        name: { type: string }
    CreateSupplierRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        contact: { $ref: '#/components/schemas/Contact' }
        status: { $ref: '#/components/schemas/Status' }
    UpdateSupplierRequest:
      type: object
      required: [name, status]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        contact: { $ref: '#/components/schemas/Contact' }
        status: { $ref: '#/components/schemas/Status' }
    SupplierList:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Supplier' }
        page: { $ref: '#/components/schemas/PageInfo' }

    ProductKind:
      type: string
      enum: [standard, bundle]
      description: |
        standard is an ordinary catalogue product. bundle is a flat physical
        kit created via POST /admin/bundles.
    ProductInput:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 10000 }
        supplier_id: { type: string, format: uuid }
        is_digital: { type: boolean }
        kind:
          allOf:
            - { $ref: '#/components/schemas/ProductKind' }
          description: Create-only; omit or standard. Kits use POST /admin/bundles.
        status: { $ref: '#/components/schemas/Status' }
        category_ids:
          type: array
          maxItems: 20
          items: { type: string, format: uuid }
        attributes:
          type: object
          additionalProperties: { type: string }
    Product:
      type: object
      required: [product_id, name, description, is_digital, kind, status, attributes, category_ids, related_product_ids, variants, skus, images, created_at, updated_at]
      properties:
        product_id: { type: string, format: uuid }
        supplier_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        is_digital: { type: boolean }
        kind: { $ref: '#/components/schemas/ProductKind' }
        status: { $ref: '#/components/schemas/Status' }
        attributes:
          type: object
          additionalProperties: { type: string }
        category_ids:
          type: array
          items: { type: string, format: uuid }
        related_product_ids:
          type: array
          description: |
            Editorial related products, in display order. Shoppers get active
            targets only; shop admins the stored list. Set with
            PUT /admin/products/{id}/related.
          items: { type: string, format: uuid }
        variants:
          type: array
          items: { $ref: '#/components/schemas/Variant' }
        skus:
          type: array
          items: { $ref: '#/components/schemas/SKU' }
        images:
          type: array
          items: { $ref: '#/components/schemas/ProductImage' }
        bundle:
          description: Present when kind is bundle.
          allOf:
            - { $ref: '#/components/schemas/Bundle' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    BundleComponentInput:
      type: object
      required: [sku_id, quantity]
      additionalProperties: false
      properties:
        sku_id: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1 }
    BundleComponent:
      type: object
      required: [sku_id, product_id, product_name, quantity]
      properties:
        sku_id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        product_name: { type: string }
        quantity: { type: integer, minimum: 1 }
    Bundle:
      type: object
      required: [components]
      properties:
        components:
          type: array
          items: { $ref: '#/components/schemas/BundleComponent' }
    BundleInput:
      type: object
      required: [name, sku_code, tax_class, components]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 10000 }
        category_ids:
          type: array
          maxItems: 20
          items: { type: string, format: uuid }
        sku_code: { type: string, minLength: 1, maxLength: 64 }
        tax_class:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        components:
          type: array
          minItems: 2
          maxItems: 50
          items: { $ref: '#/components/schemas/BundleComponentInput' }
    BundleUpdateInput:
      type: object
      required: [components]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 10000 }
        category_ids:
          type: array
          maxItems: 20
          items: { type: string, format: uuid }
        components:
          type: array
          minItems: 2
          maxItems: 50
          items: { $ref: '#/components/schemas/BundleComponentInput' }
    ProductSummary:
      type: object
      required: [product_id, name, description, is_digital, in_stock, category_ids, skus, reviews]
      properties:
        product_id: { type: string, format: uuid }
        supplier_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        is_digital: { type: boolean }
        in_stock:
          type: boolean
          description: |
            An active SKU has stock available (yc-inventory). SKUs that are
            not tracked, or in shops without inventory, are always in stock.
        category_ids:
          type: array
          items: { type: string, format: uuid }
        primary_image_id: { type: string, format: uuid }
        skus:
          type: array
          description: Active SKUs; pass their IDs to POST /prices/evaluate.
          items: { $ref: '#/components/schemas/SKUSummary' }
        reviews: { $ref: '#/components/schemas/ReviewStats' }
    RelatedProductsInput:
      type: object
      required: [product_ids]
      additionalProperties: false
      properties:
        product_ids:
          type: array
          description: The full ordered related list; at most 20 distinct ids. Empty clears.
          items: { type: string, format: uuid }
    RelatedProducts:
      type: object
      required: [product_ids]
      properties:
        product_ids:
          type: array
          items: { type: string, format: uuid }
    AlsoBoughtList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ProductSummary' }
    ReviewStats:
      type: object
      description: Approved reviews and likes (yc-review).
      required: [rating_count, like_count]
      properties:
        rating_count: { type: integer }
        rating_average:
          type: number
          format: double
          description: Absent until the product has an approved review.
        like_count: { type: integer }
    SKUSummary:
      type: object
      required: [sku_id, sku_code, variant_values]
      properties:
        sku_id: { type: string, format: uuid }
        sku_code: { type: string }
        variant_values: { $ref: '#/components/schemas/VariantValues' }
    ProductList:
      type: object
      required: [items, sort, facets, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ProductSummary' }
        sort: { $ref: '#/components/schemas/Sort' }
        facets: { $ref: '#/components/schemas/Facets' }
        page: { $ref: '#/components/schemas/PageInfo' }

    Sort:
      type: string
      enum: [popular, newest, price_asc, price_desc, rating]

    Facets:
      type: object
      description: Facets beyond the filters; which appear depends on the caller.
      properties:
        favourites:
          type: object
          description: |
            Customers only: how many active products they have ordered
            (order.placed.v1), regardless of the other filters.
          required: [product_count]
          properties:
            product_count: { type: integer }

    VariantInput:
      type: object
      required: [axis_name, values]
      additionalProperties: false
      properties:
        axis_name: { type: string, pattern: '^[a-z][a-z0-9_]*$', maxLength: 40 }
        values:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string, minLength: 1, maxLength: 100 }
    Variant:
      type: object
      required: [variant_id, axis_name, values, created_at]
      properties:
        variant_id: { type: string, format: uuid }
        axis_name: { type: string }
        values:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }
    VariantValues:
      type: object
      additionalProperties: { type: string }
      description: Variant axis to value, e.g. {"color":"Red","size":"M"}.

    SKUInput:
      type: object
      required: [sku_code, tax_class]
      additionalProperties: false
      properties:
        sku_code: { type: string, minLength: 1, maxLength: 64 }
        variant_values: { $ref: '#/components/schemas/VariantValues' }
        inventory_tracked: { type: boolean, default: true }
        tax_class:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          description: A tax class ID defined in yc-pricing, e.g. za-standard.
        weight_grams: { type: integer, minimum: 0, description: Per unit; weight-tiered shipping rates need it. }
        dimensions_mm: { $ref: '#/components/schemas/Dimensions' }
        status: { $ref: '#/components/schemas/Status' }
    Dimensions:
      type: object
      required: [length, width, height]
      additionalProperties: false
      description: Parcel size in millimetres, for carrier drivers. Stored only; rates do not use it yet.
      properties:
        length: { type: integer, minimum: 1, maximum: 10000 }
        width: { type: integer, minimum: 1, maximum: 10000 }
        height: { type: integer, minimum: 1, maximum: 10000 }
    SKU:
      type: object
      required: [sku_id, product_id, sku_code, variant_values, inventory_tracked, tax_class, status, created_at, updated_at]
      properties:
        sku_id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        sku_code: { type: string }
        variant_values: { $ref: '#/components/schemas/VariantValues' }
        inventory_tracked: { type: boolean }
        tax_class: { type: string }
        weight_grams: { type: integer }
        dimensions_mm: { $ref: '#/components/schemas/Dimensions' }
        status: { $ref: '#/components/schemas/Status' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SKUBatch:
      type: object
      required: [skus, missing]
      properties:
        skus:
          type: array
          items: { $ref: '#/components/schemas/SKUDetail' }
        missing:
          type: array
          items: { type: string, format: uuid }
    SKUDetail:
      type: object
      required: [sku_id, product_id, sku_code, product_name, variant_values, is_digital, kind, inventory_tracked, tax_class, status, components]
      properties:
        sku_id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        sku_code: { type: string }
        product_name: { type: string }
        variant_values: { $ref: '#/components/schemas/VariantValues' }
        is_digital: { type: boolean }
        kind: { $ref: '#/components/schemas/ProductKind' }
        inventory_tracked: { type: boolean }
        tax_class: { type: string }
        weight_grams: { type: integer }
        dimensions_mm: { $ref: '#/components/schemas/Dimensions' }
        status:
          type: string
          description: active only when both the SKU and its product are active.
          enum: [active, inactive, deleted]
        components:
          type: array
          description: Flat kit expansion when kind is bundle; empty otherwise.
          items: { $ref: '#/components/schemas/BundleComponent' }

    AttachImageRequest:
      type: object
      required: [image_id]
      additionalProperties: false
      properties:
        image_id: { type: string, format: uuid }
        sort_order: { type: integer }
        is_primary: { type: boolean }
    ProductImage:
      type: object
      required: [image_id, sort_order, is_primary]
      properties:
        image_id: { type: string, format: uuid, description: 'Resolve URLs with yc-image GET /images/{id}.' }
        sort_order: { type: integer }
        is_primary: { type: boolean }

    CategoryInput:
      type: object
      required: [name, slug]
      additionalProperties: false
      properties:
        parent_id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 100 }
        slug: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', maxLength: 100 }
        sort_order: { type: integer }
        image_id: { type: string, format: uuid, description: 'yc-image id of the category icon. Resolve with GET /images/{id}.' }
    Category:
      type: object
      required: [category_id, name, slug, sort_order]
      properties:
        category_id: { type: string, format: uuid }
        parent_id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        sort_order: { type: integer }
        image_id: { type: string, format: uuid, description: 'yc-image id of the category icon. Resolve with GET /images/{id}.' }
    CategoryNode:
      type: object
      required: [category_id, name, slug, sort_order, children]
      properties:
        category_id: { type: string, format: uuid }
        parent_id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        sort_order: { type: integer }
        image_id: { type: string, format: uuid, description: 'yc-image id of the category icon. Resolve with GET /images/{id}.' }
        children:
          type: array
          items: { $ref: '#/components/schemas/CategoryNode' }

    BannerInput:
      type: object
      required: [category_id, text, background_image_id, large_image_id]
      additionalProperties: false
      properties:
        category_id: { type: string, format: uuid }
        text: { type: string, minLength: 1, maxLength: 280 }
        background_image_id: { type: string, format: uuid, description: 'yc-image id of the background. Resolve with GET /images/{id}.' }
        large_image_id: { type: string, format: uuid, description: 'yc-image id of the large image. It is not the category icon. Resolve with GET /images/{id}.' }
    Banner:
      type: object
      required: [banner_id, category_id, category_name, text, background_image_id, large_image_id, sort_order]
      properties:
        banner_id: { type: string, format: uuid }
        category_id: { type: string, format: uuid }
        category_name: { type: string, description: 'The category name at read time.' }
        text: { type: string }
        background_image_id: { type: string, format: uuid }
        large_image_id: { type: string, format: uuid }
        sort_order: { type: integer }
    BannerOrder:
      type: object
      required: [ids]
      additionalProperties: false
      properties:
        ids:
          type: array
          description: Every banner of the shop, once, in the new display order.
          items: { type: string, format: uuid }

    PageInfo:
      type: object
      description: Cursor pagination (api-conventions.md §7).
      x-go-type: httpkit.PageInfo
      x-go-type-import:
        path: github.com/slaghuis/yc-platform/libs/yc-httpkit
        name: httpkit
      required: [size]
      properties:
        size: { type: integer }
        cursor: { type: string }
        next_cursor: { type: string }
        total_available: { type: integer }
    Problem:
      type: object
      description: RFC 9457 problem details (docs/standards/error-handling.md).
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
        correlation_id: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }

  responses:
    Problem:
      description: Error
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
