openapi: 3.1.0
info:
  title: yc-identity
  version: 0.4.0
  description: |
    Authentication and user identity (docs/services/yc-identity.md).
    Visitor tokens, email + password registration and login, Google and
    Facebook sign-in, refresh tokens, logout, password reset, invitations
    (ADR-030), suspend/reactivate/demote, the caller's own user, user
    administration, token validation and service tokens.

    Public routes are reached through yc-gateway, which sets X-YC-Tenant-ID,
    X-YC-Actor-ID, X-YC-Actor-Type and X-YC-Correlation-ID
    (api-conventions.md §9). /admin/ requires shop_admin or system_admin;
    /internal/ routes are reached through yc-gateway's internal listener
    (ADR-021). Errors are application/problem+json (error-handling.md).

paths:
  /visitor:
    post:
      summary: Issue a visitor token for the tenant yc-gateway resolved
      operationId: createVisitor
      responses:
        '201':
          description: Visitor created; identity.visitor.created.v1 is published.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/Problem' }

  /register:
    post:
      summary: Register with email and password
      description: |
        The calling visitor becomes a customer in place and keeps its user ID.
        Publishes identity.user.registered.v1. The visitor token stops
        validating; use the returned customer token.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /login:
    post:
      summary: Log in with email and password
      description: |
        Looks the email up in the tenant yc-gateway resolved; on an admin
        host that is _platform, so only system admins can log in there.
        Publishes identity.user.logged_in.v1.

        After password.login_max_failures failed logins for one email in a
        shop (10 by default), logins for that email are refused with 429
        until password.login_failure_window (15m) has passed, whether or not
        the email is registered. A successful login or a completed password
        reset clears the count.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Logged in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }

  /refresh:
    post:
      summary: Exchange a refresh token for a new session
      description: |
        Rotates the refresh token: the one presented stops working and the
        response carries its replacement. Presenting a refresh token that was
        already replaced or revoked revokes every token of that login.
      operationId: refresh
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: A new session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }

  /logout:
    post:
      summary: Log out
      description: |
        Revokes the caller's access token and, when given, the refresh token
        and every token rotated from the same login. yc-gateway may accept the
        access token for up to its validation cache TTL afterwards.
      operationId: logout
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogoutRequest' }
      responses:
        '204':
          description: Logged out.
        '401': { $ref: '#/components/responses/Problem' }

  /password/reset-request:
    post:
      summary: Start a password reset
      description: |
        Always 202, whether or not the email is registered. For an active user
        it stores a single-use reset token and publishes
        identity.user.password_reset_requested.v1, which carries no token.
      operationId: requestPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetRequest' }
      responses:
        '202':
          description: Accepted.
        '400': { $ref: '#/components/responses/Problem' }

  /password/reset-confirm:
    post:
      summary: Set a new password with a reset token
      description: |
        Revokes every refresh token of the user and publishes
        identity.user.password_changed.v1.
      operationId: confirmPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetConfirm' }
      responses:
        '204':
          description: Password changed.
        '400': { $ref: '#/components/responses/Problem' }

  /oauth/{provider}/start:
    post:
      summary: Start signing in with an OAuth provider
      description: |
        Returns the provider's authorisation URL (authorisation code flow with
        PKCE). The client sends the browser there; the provider redirects back
        to the shop's callback page with code and state, which the client
        posts to /oauth/{provider}/callback. The calling visitor is
        remembered as the cart merge source.
      operationId: startOAuth
      parameters:
        - $ref: '#/components/parameters/Provider'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OAuthStartRequest' }
      responses:
        '200':
          description: Where to send the browser.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthStart' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /oauth/{provider}/callback:
    post:
      summary: Complete signing in with an OAuth provider
      description: |
        Exchanges the code. A provider account already linked logs its user
        in. Otherwise a user with the same email is linked only when the
        provider reports the email verified (409 if not); with no such user,
        the visitor that started the flow becomes a customer in place, or a
        new customer is created. Google (openid/email/profile) and Facebook
        (email/public_profile) may supply a picture URL; phone is uncommon
        and never invented. When present, phone fills only if the user has
        none; the image URL is refreshed. Omitted claims do not clear
        stored values. Invalid claims are skipped. Publishes
        identity.user.registered.v1, identity.oauth_linked.v1 and
        identity.user.logged_in.v1 as applicable. Call GET /me for the
        enriched profile.
      operationId: completeOAuth
      parameters:
        - $ref: '#/components/parameters/Provider'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OAuthCallback' }
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /me:
    get:
      summary: The caller's own user
      operationId: getMe
      responses:
        '200':
          description: The user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      summary: Delete the caller's account (GDPR)
      description: |
        Customers only. Refused while the customer has unfinished orders or
        open returns (409). Anonymises the account, revokes its sessions and
        publishes identity.user.deleted.v1, which starts the GDPR cascade
        (ADR-005).
      operationId: deleteMe
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /admin/users:
    get:
      summary: List users
      description: |
        Shop admins see their own tenant. System admins see every tenant and
        may filter by tenant_id. Newest first.
      operationId: listUsers
      parameters:
        - { name: tenant_id, in: query, schema: { type: string } }
        - { name: email, in: query, schema: { type: string } }
        - { name: role, in: query, schema: { $ref: '#/components/schemas/Role' } }
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of users.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserList' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

  /admin/users/{id}:
    get:
      summary: Get a user
      operationId: getUser
      parameters:
        - $ref: '#/components/parameters/UserID'
      responses:
        '200':
          description: The user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      summary: Delete a user (system_admin, GDPR)
      description: |
        Deletes a customer or shop admin as DELETE /me does. System admins
        and visitors cannot be deleted (409). A deleted user is 404.
      operationId: deleteUser
      parameters:
        - $ref: '#/components/parameters/UserID'
      responses:
        '204': { description: Deleted. }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /admin/users/{id}/promote:
    post:
      summary: Promote a user (system_admin)
      description: |
        Raises a customer to shop_admin of their own tenant. Publishes
        identity.user.promoted.v1; the user's existing tokens stop validating.
      operationId: promoteUser
      parameters:
        - $ref: '#/components/parameters/UserID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PromoteRequest' }
      responses:
        '200':
          description: The promoted user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /admin/users/{id}/suspend:
    post:
      summary: Suspend a user (system_admin)
      description: |
        Sets status to suspended, revokes refresh families, and publishes
        identity.user.suspended.v1 (ADR-030). Cannot suspend yourself or the
        last active system admin. Idempotent when already suspended.
      operationId: suspendUser
      parameters:
        - $ref: '#/components/parameters/UserID'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SuspendRequest' }
      responses:
        '200':
          description: The suspended user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /admin/users/{id}/reactivate:
    post:
      summary: Reactivate a suspended user (system_admin)
      description: |
        Sets status to active and publishes identity.user.reactivated.v1
        (ADR-030). Idempotent when already active.
      operationId: reactivateUser
      parameters:
        - $ref: '#/components/parameters/UserID'
      responses:
        '200':
          description: The reactivated user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /admin/users/{id}/demote:
    post:
      summary: Demote a shop_admin to customer (system_admin)
      description: |
        Lowers shop_admin to customer in the same tenant and publishes
        identity.user.demoted.v1 (ADR-030). System admins cannot be demoted.
      operationId: demoteUser
      parameters:
        - $ref: '#/components/parameters/UserID'
      responses:
        '200':
          description: The demoted user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /sysadmin/invitations:
    get:
      summary: List invitations (system_admin)
      description: |
        Filter by tenant_id and status (pending, accepted, revoked, expired).
        Newest first (ADR-030).
      operationId: listInvitations
      parameters:
        - { name: tenant_id, in: query, schema: { type: string } }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/InvitationStatus' }
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of invitations.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationList' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      summary: Create an invitation (system_admin)
      description: |
        Invites an email to system_admin on _platform or shop_admin on a shop.
        Requires Idempotency-Key. Publishes identity.user.invited.v1 and emails
        the accept link via yc-message (ADR-030).
      operationId: createInvitation
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, maxLength: 255 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInvitationRequest' }
      responses:
        '201':
          description: Invitation created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invitation' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /sysadmin/invitations/{id}/resend:
    post:
      summary: Resend an invitation (system_admin)
      description: |
        Issues a new token (voiding the old one), republishes
        identity.user.invited.v1, and emails the link again.
      operationId: resendInvitation
      parameters:
        - $ref: '#/components/parameters/InvitationID'
      responses:
        '200':
          description: Invitation resent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invitation' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /sysadmin/invitations/{id}:
    delete:
      summary: Revoke a pending invitation (system_admin)
      description: |
        Voids the token and publishes identity.user.invitation_revoked.v1.
      operationId: revokeInvitation
      parameters:
        - $ref: '#/components/parameters/InvitationID'
      responses:
        '204': { description: Revoked. }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /invitations/accept:
    post:
      summary: Accept an invitation
      description: |
        Anonymous. Sets password (or verifies current password for an existing
        customer upgrade), activates the invited role, and returns a session.
        Unknown, used and expired tokens share one error; failures are
        throttled like login (ADR-030).
      operationId: acceptInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptInvitationRequest' }
      responses:
        '200':
          description: Accepted; session issued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }

  /internal/validate-token:
    post:
      summary: Validate an access token (called by yc-gateway)
      operationId: validateToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              additionalProperties: false
              properties:
                token: { type: string }
      responses:
        '200':
          description: |
            The token is valid: a user token whose user is active, still has
            the token's role and has not logged it out, or a service token
            whose client is still configured.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenIdentity' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }

  /internal/service-token:
    post:
      summary: Issue a service token (ADR-021)
      description: |
        Client credentials from yc-identity's service_clients config. Reached
        through yc-gateway's internal listener without a token.
      operationId: issueServiceToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id, client_secret]
              additionalProperties: false
              properties:
                client_id: { type: string }
                client_secret: { type: string }
      responses:
        '200':
          description: A service token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceToken' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }

components:
  parameters:
    Provider:
      name: provider
      in: path
      required: true
      schema: { type: string, enum: [google, facebook] }
    UserID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    InvitationID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }

  schemas:
    ActorType:
      type: string
      enum: [visitor, customer, shop_admin, system_admin, service]
    Role:
      type: string
      enum: [visitor, customer, shop_admin, system_admin]
    Session:
      type: object
      required: [access_token, token_type, expires_at, user_id, tenant_id, role]
      properties:
        access_token: { type: string, description: RS256 JWT }
        token_type: { type: string, const: Bearer }
        expires_at: { type: string, format: date-time }
        user_id: { type: string, format: uuid }
        tenant_id: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        refresh_token:
          type: string
          description: Opaque, single use; absent for visitors.
        refresh_expires_at: { type: string, format: date-time }
    ServiceToken:
      type: object
      required: [access_token, token_type, expires_at]
      properties:
        access_token: { type: string, description: RS256 JWT with actor_type service }
        token_type: { type: string, const: Bearer }
        expires_at: { type: string, format: date-time }
    RefreshRequest:
      type: object
      required: [refresh_token]
      additionalProperties: false
      properties:
        refresh_token: { type: string }
    LogoutRequest:
      type: object
      additionalProperties: false
      properties:
        refresh_token: { type: string }
    PasswordResetRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email: { type: string }
    PasswordResetConfirm:
      type: object
      required: [token, password]
      additionalProperties: false
      properties:
        token: { type: string }
        password: { type: string, minLength: 10, maxLength: 128 }
    OAuthStartRequest:
      type: object
      additionalProperties: false
      properties:
        login_hint:
          type: string
          description: Email to suggest to the provider.
    OAuthStart:
      type: object
      required: [authorization_url]
      properties:
        authorization_url: { type: string }
    OAuthCallback:
      type: object
      required: [code, state]
      additionalProperties: false
      properties:
        code: { type: string }
        state: { type: string }
    RegisterRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 10, maxLength: 128 }
        display_name: { type: string, maxLength: 100 }
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string }
        password: { type: string }
    PromoteRequest:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role: { type: string, enum: [shop_admin] }
    SuspendRequest:
      type: object
      additionalProperties: false
      properties:
        reason: { type: string, maxLength: 500 }
    InvitationStatus:
      type: string
      enum: [pending, accepted, revoked, expired]
    CreateInvitationRequest:
      type: object
      required: [tenant_id, email, role]
      additionalProperties: false
      properties:
        tenant_id: { type: string }
        email: { type: string, format: email, maxLength: 254 }
        role: { type: string, enum: [shop_admin, system_admin] }
        display_name: { type: string, maxLength: 100 }
        accept_host:
          type: string
          description: Hostname for the accept link; optional when known from platform_hosts or shop_hosts.
    AcceptInvitationRequest:
      type: object
      required: [token, password]
      additionalProperties: false
      properties:
        token: { type: string }
        password: { type: string, minLength: 10, maxLength: 128 }
        display_name: { type: string, maxLength: 100 }
    Invitation:
      type: object
      required: [invitation_id, tenant_id, email, role, status, expires_at, created_at]
      properties:
        invitation_id: { type: string, format: uuid }
        tenant_id: { type: string }
        email: { type: string }
        role: { type: string, enum: [shop_admin, system_admin] }
        status: { $ref: '#/components/schemas/InvitationStatus' }
        display_name: { type: string }
        expires_at: { type: string, format: date-time }
        invited_by: { type: string, format: uuid }
        accepted_user_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
    InvitationList:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Invitation' }
        page: { $ref: '#/components/schemas/PageInfo' }
    TokenIdentity:
      type: object
      required: [tenant_id, actor_id, actor_type, jti, expires_at]
      properties:
        tenant_id: { type: string }
        actor_id: { type: string, description: 'User ID, or the service name for service tokens' }
        actor_type: { $ref: '#/components/schemas/ActorType' }
        jti: { type: string, format: uuid }
        expires_at: { type: string, format: date-time }
    User:
      type: object
      required: [user_id, tenant_id, role, status, created_at]
      properties:
        user_id: { type: string, format: uuid }
        tenant_id: { type: string }
        email: { type: string, description: Absent for visitors. }
        display_name: { type: string }
        phone_e164:
          type: string
          description: |
            Optional E.164 phone from OAuth when the provider supplied one.
            Absent when unset. Password registration does not set it; there
            is no customer PATCH /me in this release.
        profile_image_url:
          type: string
          description: |
            Optional https avatar URL from OAuth. Absent when unset. Not a
            yc-image id. Re-login refreshes the URL when the provider sends one.
        role: { $ref: '#/components/schemas/Role' }
        status: { type: string, enum: [active, suspended, deleted] }
        created_at: { type: string, format: date-time }
    UserList:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/User' }
        page: { $ref: '#/components/schemas/PageInfo' }
    PageInfo:
      type: object
      description: Cursor pagination (api-conventions.md §7).
      x-go-type: httpkit.PageInfo
      x-go-type-import:
        path: github.com/slaghuis/yc-platform/libs/yc-httpkit
        name: httpkit
