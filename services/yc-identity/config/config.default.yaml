service: yc-identity
environment: ${YC_ENVIRONMENT:-dev}
http:
  listen: ":8080"
log:
  level: ${LOG_LEVEL:-info}
database:
  url: ${YC_IDENTITY_DB_URL}
  migrate_on_start: true
nats:
  url: ${NATS_URL}
telemetry:
  otlp_endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}
jwt:
  issuer: yc-identity
  private_key_file: ${YC_IDENTITY_JWT_PRIVATE_KEY_FILE}
  access_token_ttl: 15m
  visitor_token_ttl: 24h
  refresh_token_ttl: 720h
  service_token_ttl: 15m
# Argon2id cost (docs/services/yc-identity.md, Password Storage). Existing
# hashes keep verifying with the parameters they were made with.
password:
  argon2:
    time: 2
    memory_kb: 65536
    threads: 2
  reset_ttl: 1h
  # The reset page emailed through yc-message: "{host}" is the shop host
  # the request came in on, "{token}" the reset token. Override with
  # YC_IDENTITY__PASSWORD__RESET_URL.
  reset_url: "https://{host}/account/reset-password?token={token}"
  # Logs reset tokens. Development only; refused in production.
  log_reset_links: ${YC_IDENTITY_LOG_RESET_LINKS:-false}
  # After this many failed sign-ins for one email in a shop, sign-in is
  # refused (429) for the rest of the window, whether or not the email is
  # registered. 0 turns the limit off.
  login_max_failures: 10
  login_failure_window: 15m

# Admin invitations (ADR-030). "{host}" and "{token}" in accept_url.
invitations:
  ttl: 72h
  accept_url: "https://{host}/account/accept-invite?token={token}"
  log_invite_links: ${YC_IDENTITY_LOG_INVITE_LINKS:-false}

# Hostnames that resolve to _platform at yc-gateway (its platform_hosts).
# [0] is used for system_admin invite links. Keep equal to the gateway list.
platform_hosts:
  - ${YC_IDENTITY_PLATFORM_HOSTS:-admin.localhost}

# Self-registration with yc-gateway's internal listener (ADR-020 rule 7).
gateway:
  internal_url: ${YC_GATEWAY_INTERNAL_URL}
  advertise_url: ${YC_IDENTITY_ADVERTISE_URL:-http://yc-identity:8080}
  interval: 5s

# Idempotency-Key responses are kept at least 24 h (api-conventions.md §10).
idempotency:
  retention: 24h
  purge_interval: 1h

# Internal calls through yc-gateway (ADR-021): yc-message sends reset
# and invite links. With no gateway URL, links are not sent.
internal_calls:
  gateway_url: ${YC_GATEWAY_INTERNAL_URL}
  client_secret: ${YC_IDENTITY_SERVICE_SECRET}
  timeout: 5s

# Service clients for internal calls (ADR-021): name → secret of at least
# 32 characters. A client with no secret is disabled.
service_clients:
  yc-cart: ${YC_CART_SERVICE_SECRET}
  yc-orders: ${YC_ORDERS_SERVICE_SECRET}
  yc-checkout: ${YC_CHECKOUT_SERVICE_SECRET}
  yc-identity: ${YC_IDENTITY_SERVICE_SECRET}
  yc-message: ${YC_MESSAGE_SERVICE_SECRET}
  yc-preference: ${YC_PREFERENCE_SERVICE_SECRET}
  yc-review: ${YC_REVIEW_SERVICE_SECRET}
  yc-shipping: ${YC_SHIPPING_SERVICE_SECRET}

# OAuth providers. A provider is enabled by a client ID and secret, or by
# fake (development only: signs in whatever email the client passes as
# login_hint). "{host}" in redirect_url is the shop host the request came
# in on; register each shop's callback URL with the provider. Override with
# YC_IDENTITY__OAUTH__GOOGLE__REDIRECT_URL and so on.
oauth:
  state_ttl: 10m
  timeout: 10s
  google:
    client_id: ${YC_IDENTITY_GOOGLE_CLIENT_ID}
    client_secret: ${YC_IDENTITY_GOOGLE_CLIENT_SECRET}
    redirect_url: "https://{host}/oauth/google/callback"
    fake: ${YC_IDENTITY_OAUTH_FAKE:-false}
  facebook:
    client_id: ${YC_IDENTITY_FACEBOOK_CLIENT_ID}
    client_secret: ${YC_IDENTITY_FACEBOOK_CLIENT_SECRET}
    redirect_url: "https://{host}/oauth/facebook/callback"
    fake: ${YC_IDENTITY_OAUTH_FAKE:-false}
