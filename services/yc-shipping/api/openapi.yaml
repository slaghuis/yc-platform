openapi: 3.1.0
info:
  title: yc-shipping
  version: 0.1.0
  description: |
    Shipping zones, rates, quotes, delivery schedules/slots and shipments
    (docs/services/yc-shipping.md). Phase 6 + WP4c (#30): zones and rates
    (flat, weight-tiered, price-tiered), optional delivery schedules with
    capacity-backed slots, quotes for yc-checkout, shipments for yc-orders
    with the manual carrier driver, shop-admin status updates and public
    tracking.

    Routes are reached through yc-gateway, which sets X-YC-Tenant-ID,
    X-YC-Actor-ID, X-YC-Actor-Type and X-YC-Correlation-ID
    (api-conventions.md §9). /internal routes are for service callers
    (ADR-021). Addresses are free-form JSON (ADR-015): zones match the
    address's country_code and, optionally, values under its fields object.
    Amounts are minor units of the store currency (ADR-014). Errors are
    application/problem+json (error-handling.md).
    Weekdays on schedules are 0=Sunday … 6=Saturday. Default schedule
    timezone is Africa/Johannesburg. Slot IDs are "{schedule_id}_{unix}".

paths:
  /shipping/zones:
    get:
      summary: List the shop's shipping zones
      description: For the storefront, e.g. to say where the shop delivers.
      operationId: listPublicZones
      responses:
        '200':
          description: The zones in matching order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicZoneList' }

  /shipping/tracking/{tracking_number}:
    parameters:
      - name: tracking_number
        in: path
        required: true
        schema: { type: string, maxLength: 64 }
    get:
      summary: Track a shipment
      description: Status and history for anyone with the tracking number; no address or order.
      operationId: trackShipment
      responses:
        '200':
          description: The shipment's progress.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tracking' }
        '404': { $ref: '#/components/responses/Problem' }

  /admin/zones:
    get:
      summary: List zones
      operationId: listZones
      responses:
        '200':
          description: The zones in matching order (priority, then name).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ZoneList' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      summary: Create a zone
      operationId: createZone
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ZoneInput' }
      responses:
        '201':
          description: The zone.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Zone' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

  /admin/zones/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    put:
      summary: Replace a zone
      operationId: updateZone
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ZoneInput' }
      responses:
        '200':
          description: The zone.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Zone' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      summary: Delete a zone and its rates
      operationId: deleteZone
      responses:
        '204': { description: Deleted. }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /admin/rates:
    get:
      summary: List rates
      operationId: listRates
      parameters:
        - name: zone_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The rates, by zone and method.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RateList' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      summary: Create a rate
      description: A zone has one rate per method; another is 409.
      operationId: createRate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RateInput' }
      responses:
        '201':
          description: The rate.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rate' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /admin/rates/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    put:
      summary: Replace a rate
      operationId: updateRate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RateInput' }
      responses:
        '200':
          description: The rate.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rate' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
    delete:
      summary: Delete a rate
      operationId: deleteRate
      responses:
        '204': { description: Deleted. }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /admin/shipping/schedules:
    get:
      summary: List delivery schedules
      operationId: listSchedules
      responses:
        '200':
          description: The schedules by name.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleList' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      summary: Create a delivery schedule
      operationId: createSchedule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleInput' }
      responses:
        '201':
          description: The schedule.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Schedule' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

  /admin/shipping/schedules/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      summary: Get a delivery schedule
      operationId: getSchedule
      responses:
        '200':
          description: The schedule.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Schedule' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      summary: Replace a delivery schedule
      operationId: updateSchedule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleInput' }
      responses:
        '200':
          description: The schedule.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Schedule' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      summary: Delete a delivery schedule
      description: Refused with 409 while any rate still references it.
      operationId: deleteSchedule
      responses:
        '204': { description: Deleted. }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /admin/shipments:
    get:
      summary: List shipments
      operationId: listShipments
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ShipmentStatus' }
      responses:
        '200':
          description: A page of shipments, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShipmentList' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

  /admin/shipments/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      summary: Get a shipment
      operationId: getShipment
      responses:
        '200':
          description: The shipment and its history.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShipmentDetail' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /admin/shipments/{id}/manual-update:
    parameters:
      - $ref: '#/components/parameters/ID'
    post:
      summary: Report a manual shipment's progress
      description: |
        For the manual driver: in_transit (repeatable, e.g. with the
        courier's name and reference), delivered, or exception (with a
        message). Publishes shipping.in_transit.v1, shipping.delivered.v1 or
        shipping.delivery_exception.v1; yc-orders follows. A status the
        shipment cannot move to is 409.
      operationId: updateShipment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManualUpdateInput' }
      responses:
        '200':
          description: The shipment and its history.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShipmentDetail' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /internal/quote:
    post:
      summary: Quote shipping to an address
      description: |
        For yc-checkout. Resolves the first zone (by priority) covering the
        address and prices its active rates, cheapest first. Weight-tiered
        rates need a weight for every physical item; rates that do not apply
        are left out. No zone means no options: the shop does not ship there.
      operationId: quoteShipping
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuoteInput' }
      responses:
        '200':
          description: The options.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuoteResult' }
        '400': { $ref: '#/components/responses/Problem' }

  /internal/slots:
    get:
      summary: List available delivery slots for a rate
      description: |
        For yc-checkout. Generates windows from the rate's schedule, applies
        lead time, same-day cut-off and blackouts, and subtracts bookings.
        Full windows are omitted. Range is at most 14 days.
      operationId: listSlots
      parameters:
        - name: rate_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
          description: Inclusive start date (YYYY-MM-DD) in the schedule timezone.
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
          description: Inclusive end date; at most 14 days after from.
      responses:
        '200':
          description: Available slots, sorted by start.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SlotList' }
        '400': { $ref: '#/components/responses/Problem' }

  /internal/slots/{slot_id}:
    parameters:
      - name: slot_id
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 128 }
    get:
      summary: Get one slot if it still has capacity
      description: |
        Soft capacity check for checkout PUT /slot. Returns 404 when the
        window is invalid, past cut-off, or full.
      operationId: getSlot
      responses:
        '200':
          description: The slot with remaining capacity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Slot' }
        '404': { $ref: '#/components/responses/Problem' }

  /internal/slots/{slot_id}/book:
    parameters:
      - name: slot_id
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 128 }
    post:
      summary: Book a delivery slot
      description: |
        Hard book at ORDER_CREATE. booking_key is the checkout session ID.
        Idempotent for the same key and slot; 409 when full.
      operationId: bookSlot
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SlotBookInput' }
      responses:
        '200':
          description: The booked slot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Slot' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /internal/slots/{slot_id}/release:
    parameters:
      - name: slot_id
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 128 }
    post:
      summary: Release a delivery slot booking
      description: |
        On abandon/compensate. Deletes the booking for booking_key on this
        slot. Missing bookings are a no-op (204).
      operationId: releaseSlot
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SlotBookInput' }
      responses:
        '204': { description: Released (or already absent). }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /internal/shipments:
    post:
      summary: Create an order's shipment
      description: |
        For yc-orders when the shop admin packages an order. The rate's
        carrier driver books it (the manual driver issues a tracking number)
        and shipping.label_created.v1 is published. An order has one
        shipment: asking again returns it.
      operationId: createShipment
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShipmentInput' }
      responses:
        '200':
          description: The shipment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Shipment' }
        '400': { $ref: '#/components/responses/Problem' }

components:
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 255 }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }

  schemas:
    Address:
      type: object
      additionalProperties: true
      description: Free-form (ADR-015); country_code and fields are used for zone matching.
    MatchRule:
      type: object
      required: [country_code]
      additionalProperties: false
      properties:
        country_code: { type: string, description: ISO 3166-1 alpha-2. }
        fields:
          type: object
          additionalProperties: { type: string }
          description: Exact values (case-insensitive) the address's fields must have, e.g. {"province":"Gauteng"}.
    ZoneInput:
      type: object
      required: [name, match_rules]
      additionalProperties: false
      properties:
        name: { type: string }
        match_rules:
          type: array
          items: { $ref: '#/components/schemas/MatchRule' }
        priority:
          type: integer
          description: Zones are matched lowest first (0 to 1000, default 100).
    Zone:
      type: object
      required: [zone_id, name, match_rules, priority, created_at, updated_at]
      properties:
        zone_id: { type: string, format: uuid }
        name: { type: string }
        match_rules:
          type: array
          items: { $ref: '#/components/schemas/MatchRule' }
        priority: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ZoneList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Zone' }
    PublicZone:
      type: object
      required: [zone_id, name, match_rules]
      properties:
        zone_id: { type: string, format: uuid }
        name: { type: string }
        match_rules:
          type: array
          items: { $ref: '#/components/schemas/MatchRule' }
    PublicZoneList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PublicZone' }
    PricingType:
      type: string
      enum: [flat, weight_tiered, price_tiered]
    WeightTier:
      type: object
      required: [max_weight_g, amount_minor]
      additionalProperties: false
      properties:
        max_weight_g: { type: integer, format: int64 }
        amount_minor: { type: integer, format: int64 }
    PriceTier:
      type: object
      required: [min_subtotal_minor, amount_minor]
      additionalProperties: false
      properties:
        min_subtotal_minor: { type: integer, format: int64, description: Items total (gross) this tier starts at. }
        amount_minor: { type: integer, format: int64 }
    RateInput:
      type: object
      required: [zone_id, method, display_name, pricing_type]
      additionalProperties: false
      properties:
        zone_id: { type: string, format: uuid }
        method: { type: string, description: 'The option ID checkout shows, e.g. standard; one per zone.' }
        display_name: { type: string }
        pricing_type: { $ref: '#/components/schemas/PricingType' }
        flat_amount_minor: { type: integer, format: int64 }
        weight_tiers:
          type: array
          items: { $ref: '#/components/schemas/WeightTier' }
        price_tiers:
          type: array
          items: { $ref: '#/components/schemas/PriceTier' }
        estimated_days_min: { type: integer }
        estimated_days_max: { type: integer }
        carrier_driver: { type: string, default: manual }
        active: { type: boolean, default: true }
        schedule_id: { type: string, format: uuid, description: Delivery schedule for slot booking. }
        requires_delivery_slot:
          type: boolean
          default: false
          description: When true, schedule_id is required (hard 400 if missing or unknown).
    Rate:
      type: object
      required: [rate_id, zone_id, method, display_name, pricing_type, flat_amount_minor, weight_tiers, price_tiers,
        carrier_driver, requires_delivery_slot, active, created_at, updated_at]
      properties:
        rate_id: { type: string, format: uuid }
        zone_id: { type: string, format: uuid }
        method: { type: string }
        display_name: { type: string }
        pricing_type: { $ref: '#/components/schemas/PricingType' }
        flat_amount_minor: { type: integer, format: int64 }
        weight_tiers:
          type: array
          items: { $ref: '#/components/schemas/WeightTier' }
        price_tiers:
          type: array
          items: { $ref: '#/components/schemas/PriceTier' }
        estimated_days_min: { type: integer }
        estimated_days_max: { type: integer }
        carrier_driver: { type: string }
        schedule_id: { type: string, format: uuid }
        requires_delivery_slot: { type: boolean }
        active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RateList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Rate' }
    QuoteItem:
      type: object
      required: [sku_id, quantity]
      additionalProperties: false
      properties:
        sku_id: { type: string, format: uuid }
        quantity: { type: integer, format: int64 }
        weight_grams: { type: integer, format: int64, description: Per unit; absent when unknown. }
        is_digital: { type: boolean }
    QuoteInput:
      type: object
      required: [delivery_address, items, subtotal_minor]
      additionalProperties: false
      properties:
        delivery_address: { $ref: '#/components/schemas/Address' }
        items:
          type: array
          items: { $ref: '#/components/schemas/QuoteItem' }
        subtotal_minor: { type: integer, format: int64, description: 'Items total (gross), for price-tiered rates.' }
    QuoteZone:
      type: object
      required: [zone_id, name]
      properties:
        zone_id: { type: string, format: uuid }
        name: { type: string }
    ShippingOption:
      type: object
      required: [option_id, rate_id, name, amount_minor, carrier_driver, requires_delivery_slot]
      properties:
        option_id: { type: string, description: The rate's method. }
        rate_id: { type: string, format: uuid }
        name: { type: string }
        amount_minor: { type: integer, format: int64 }
        estimated_days_min: { type: integer }
        estimated_days_max: { type: integer }
        carrier_driver: { type: string }
        schedule_id: { type: string, format: uuid }
        requires_delivery_slot: { type: boolean }
    QuoteResult:
      type: object
      required: [options]
      properties:
        zone: { $ref: '#/components/schemas/QuoteZone' }
        options:
          type: array
          items: { $ref: '#/components/schemas/ShippingOption' }
    ShipmentInput:
      type: object
      required: [order_id, order_number, method, delivery_address]
      additionalProperties: false
      properties:
        order_id: { type: string, format: uuid }
        order_number: { type: string }
        method: { type: string, description: The shipping option the customer chose. }
        rate_id: { type: string, format: uuid }
        delivery_address: { $ref: '#/components/schemas/Address' }
    ShipmentStatus:
      type: string
      enum: [label_created, in_transit, delivered, exception, cancelled]
    Shipment:
      type: object
      required: [shipment_id, order_id, order_number, method, carrier_driver, tracking_number, status,
        delivery_address, created_at, updated_at]
      properties:
        shipment_id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        order_number: { type: string }
        method: { type: string }
        rate_id: { type: string, format: uuid }
        carrier_driver: { type: string }
        tracking_number: { type: string }
        label_url: { type: string }
        status: { $ref: '#/components/schemas/ShipmentStatus' }
        delivery_address: { $ref: '#/components/schemas/Address' }
        carrier_name: { type: string }
        carrier_reference: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TrackingEvent:
      type: object
      required: [status, occurred_at]
      properties:
        status: { $ref: '#/components/schemas/ShipmentStatus' }
        message: { type: string }
        occurred_at: { type: string, format: date-time }
    ShipmentDetail:
      allOf:
        - $ref: '#/components/schemas/Shipment'
        - type: object
          required: [events]
          properties:
            events:
              type: array
              items: { $ref: '#/components/schemas/TrackingEvent' }
    ShipmentList:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Shipment' }
        page: { $ref: '#/components/schemas/PageInfo' }
    ManualUpdateInput:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [in_transit, delivered, exception]
        message: { type: string, description: Required for exception. }
        carrier_name: { type: string }
        carrier_reference: { type: string }
        occurred_at: { type: string, format: date-time, description: Defaults to now. }
    Tracking:
      type: object
      required: [tracking_number, status, method, events]
      properties:
        tracking_number: { type: string }
        status: { $ref: '#/components/schemas/ShipmentStatus' }
        method: { type: string }
        carrier_name: { type: string }
        carrier_reference: { type: string }
        events:
          type: array
          items: { $ref: '#/components/schemas/TrackingEvent' }
    PageInfo:
      type: object
      description: Cursor pagination (api-conventions.md §7).
      x-go-type: httpkit.PageInfo
      x-go-type-import:
        path: github.com/slaghuis/yc-platform/libs/yc-httpkit
        name: httpkit
      required: [size]
      properties:
        size: { type: integer }
        cursor: { type: string }
        next_cursor: { type: string }
        total_available: { type: integer }
    ScheduleInput:
      type: object
      required: [name, window_minutes, weekdays, open_time, close_time, capacity_per_window]
      additionalProperties: false
      properties:
        name: { type: string }
        timezone:
          type: string
          description: IANA timezone; defaults to Africa/Johannesburg when omitted.
        window_minutes: { type: integer, minimum: 5, maximum: 240 }
        weekdays:
          type: array
          items: { type: integer, minimum: 0, maximum: 6 }
          description: '0=Sunday … 6=Saturday (Go time.Weekday).'
        open_time: { type: string, description: 'Local HH:MM.' }
        close_time: { type: string, description: 'Local HH:MM; must be after open_time.' }
        capacity_per_window: { type: integer, minimum: 1 }
        min_lead_minutes: { type: integer, minimum: 0, default: 0 }
        same_day_cutoff: { type: string, description: 'Optional local HH:MM; after this, today has no windows.' }
        blackout_dates:
          type: array
          items: { type: string, format: date }
        active: { type: boolean, default: true }
    Schedule:
      type: object
      required: [schedule_id, name, timezone, window_minutes, weekdays, open_time, close_time,
        capacity_per_window, min_lead_minutes, blackout_dates, active, created_at, updated_at]
      properties:
        schedule_id: { type: string, format: uuid }
        name: { type: string }
        timezone: { type: string }
        window_minutes: { type: integer }
        weekdays:
          type: array
          items: { type: integer }
        open_time: { type: string }
        close_time: { type: string }
        capacity_per_window: { type: integer }
        min_lead_minutes: { type: integer }
        same_day_cutoff: { type: string }
        blackout_dates:
          type: array
          items: { type: string, format: date }
        active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ScheduleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Schedule' }
    Slot:
      type: object
      required: [slot_id, schedule_id, start_at, end_at, timezone, remaining_capacity]
      properties:
        slot_id: { type: string, description: 'Deterministic "{schedule_id}_{unix}".' }
        schedule_id: { type: string, format: uuid }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }
        timezone: { type: string }
        remaining_capacity: { type: integer }
    SlotList:
      type: object
      required: [slots]
      properties:
        slots:
          type: array
          items: { $ref: '#/components/schemas/Slot' }
    SlotBookInput:
      type: object
      required: [booking_key]
      additionalProperties: false
      properties:
        booking_key:
          type: string
          minLength: 1
          maxLength: 128
          description: Checkout session ID (ORDER_CREATE / abandon).
    Problem:
      type: object
      description: RFC 9457 problem details (docs/standards/error-handling.md).
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
        correlation_id: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [field, code, message]
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }

  responses:
    Problem:
      description: An error.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
