name: E2E

# Manual only until the first cross-service flow exists (implementation plan,
# Phase 1). Re-enable the push and nightly triggers then:
#
#   push:
#     branches: [main]
#   schedule:
#     - cron: '0 2 * * *'
on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: '**/go.sum'
      - uses: arduino/setup-task@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Start dev stack
        run: task devstack:up
      - name: Start the services
        run: task devstack:app
      - name: Run E2E tests
        run: task test:e2e
      - name: Collect logs on failure
        if: failure()
        run: docker compose logs > docker-logs.txt
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: docker-logs
          path: docker-logs.txt
