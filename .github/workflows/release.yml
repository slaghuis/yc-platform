name: Release

on:
  push:
    tags: ['v*']

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - yc-identity
          - yc-gateway
          - yc-image
          - yc-preference
          - yc-product
          - yc-pricing
          - yc-inventory
          - yc-cart
          - yc-review
          - yc-checkout
          - yc-payment
          - yc-shipping
          - yc-orders
          - yc-message
          - yc-audit
          - yc-monitor
          - yc-analytics
          - yc-tenant
          - yc-support
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile.service
          build-args: |
            SERVICE=${{ matrix.service }}
            VERSION=${{ github.ref_name }}
          push: true
          tags: |
            ghcr.io/slaghuis/yc-platform/${{ matrix.service }}:${{ github.sha }}
            ghcr.io/slaghuis/yc-platform/${{ matrix.service }}:${{ github.ref_name }}
            ghcr.io/slaghuis/yc-platform/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
