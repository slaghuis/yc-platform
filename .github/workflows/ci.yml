name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          args: --timeout=10m

  schema-check:
    name: Validate schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install jq
        run: sudo apt-get install -y jq
      - name: Validate
        run: ./schemas/yc-event-schemas/scripts/validate_all.sh
      - name: Backward compat
        if: github.event_name == 'pull_request'
        run: ./schemas/yc-event-schemas/scripts/check_backward_compat.sh origin/${{ github.base_ref }}

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
      - name: Run tests
        run: task test

  build-check:
    name: Build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go work sync
        run: go work sync
      - name: Build all
        run: |
          for dir in services/*/; do
            svc=$(basename "$dir")
            if [ -d "$dir/cmd/$svc" ]; then
              echo "Building $svc..."
              (cd "$dir" && go build ./cmd/"$svc")
            fi
          done