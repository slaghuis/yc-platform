name: E2E

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Install Task
        uses: arduino/setup-task@v2
      - name: Start dev stack
        run: task devstack:up
      - name: Run E2E tests
        run: task test:e2e
      - name: Collect logs on failure
        if: failure()
        run: docker compose logs > docker-logs.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: docker-logs
          path: docker-logs.txt